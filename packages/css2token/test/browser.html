<!DOCTYPE html>
<html lang="zh">
  <meta charset="utf-8" /><title>css2token 浏览器契约验收</title>
  <style>
    body {
      font: 16px system-ui;
      padding: 24px;
      background: #fff;
      color: #222;
    }
    body.dark {
      background: #171717;
      color: #eee;
    }
    button {
      padding: 8px;
      margin: 8px;
    }
    td,
    th {
      padding: 6px 16px;
      text-align: left;
      border-bottom: 1px solid #888;
    }
    .fail {
      color: #d33;
    }
  </style>
  <h1>CSS → Flutter Token 浏览器验收</h1>
  <button id="light">Light</button
  ><button id="dark">Dark</button>
  <p id="summary"></p>
  <table>
    <thead>
      <tr>
        <th>契约</th>
        <th>Light</th>
        <th>Dark</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
  <script type="module">
    import { generateFlutterThemeFromParts } from "../index.mjs";
    import { cases } from "./cases.mjs";
    const baseline =
      "--td-brand-color-7:#123; --td-brand-color:var(--td-brand-color-7);";
    const rows = [
      ...cases,
      [
        "基线增量与恢复",
        "baseline",
        (t) =>
          t.color.brandColor7 === "#445566" &&
          t.ref.brandColor === "brandColor7",
      ],
      [
        "双模式独立与共享覆盖",
        null,
        (t, mode) =>
          t.color.brandColor7 === (mode === "light" ? "#112233" : "#AABBCC") &&
          t.radius.radiusSmall === 4,
      ],
    ];
    let passed = 0;
    for (const [name, css, check] of rows) {
      const theme =
        css === "baseline"
          ? generateFlutterThemeFromParts(
              baseline.replace("#123", "#456"),
              baseline.replace("#123", "#456"),
              "",
              { light: baseline, dark: baseline, extra: "" }
            )
          : css === null
          ? generateFlutterThemeFromParts(
              "--td-brand-color-7:#123; --td-radius-small:1px",
              "--td-brand-color-7:#abc",
              "--td-radius-small:4px;"
            )
          : generateFlutterThemeFromParts(css, css, "");
      const tr = document.createElement("tr");
      const label = document.createElement("td");
      label.textContent = name;
      tr.append(label);
      for (const mode of ["light", "dark"]) {
        const td = document.createElement("td");
        try {
          if (!check(theme[mode], mode))
            throw new Error(JSON.stringify(theme[mode]));
          td.textContent = "PASS";
          passed++;
        } catch (error) {
          td.textContent = error.message;
          td.className = "fail";
        }
        tr.append(td);
      }
      document.querySelector("#results").append(tr);
    }
    document.querySelector("#summary").textContent = `${passed}/${
      rows.length * 2
    } 通过`;
    for (const mode of ["light", "dark"])
      document.querySelector(`#${mode}`).onclick = () => {
        document.body.className = mode;
        document.documentElement.style.colorScheme = mode;
      };
  </script>
</html>
