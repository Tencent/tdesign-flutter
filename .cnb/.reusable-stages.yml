# ===== 公共可复用片段（以 . 开头，不会被识别为分支名）=====
# 本文件由 .cnb.yml 通过 include + !reference 引入使用

# 安装组件依赖
.install-component:
  name: install component dependencies
  script: cd tdesign-component && flutter pub get

# 安装示例依赖
.install-example:
  name: install example dependencies
  script: cd tdesign-component/example && flutter pub get

# 静态分析：lint 零告警（0 error / 0 warning / 0 info）。
# 启用 --fatal-infos，任何 info 级告警都会阻断构建，作为 lint 零告警的机器硬门槛。
# （存量 deprecated 告警已在本 PR 逐项清零，故可开启严格模式。）
.analyze:
  name: flutter analyze
  script: cd tdesign-component && flutter analyze --fatal-infos

# 六个组件的交互测试与生产源码 95% 覆盖率门禁，双 Flutter 版本共用。
.component-regression-tests:
  name: flutter test (component regression)
  script: cd tdesign-component && dart run tool/run_component_regression.dart

.regression-tool-tests:
  name: flutter test (regression tooling)
  script: cd tdesign-component && flutter test --no-pub test/tool/check_component_coverage_test.dart test/tool/run_component_regression_test.dart

# Refresh Demo 结构断言仅在 Flutter 3.32.0 Linux 视觉回归环境执行。
.refresh-demo-tests:
  name: flutter test (refresh demo structure)
  script: cd tdesign-component && flutter test --no-pub test/components/refresh/t_refresh_test.dart --tags demo

# Refresh Golden 固定在 Flutter 3.32.0 Linux，以 0% 像素差异严格比较。
.refresh-golden:
  name: flutter test (refresh golden)
  script: cd tdesign-component && flutter test --no-pub test/components/refresh/t_refresh_golden_test.dart

# Upload Golden 固定在 Flutter 3.32.0 Linux 环境执行。
.upload-tests:
  name: flutter test (upload golden)
  script: cd tdesign-component && flutter test --no-pub test/components/upload/t_upload_golden_test.dart

# Form / Input / Textarea 完整 Demo 页面 Golden 固定在 Flutter 3.32.0 执行。
# 复用单套标准基线和受控跨平台比较器，并由测试严格校验页面结构与几何。
.form-input-page-golden:
  name: flutter test (form input textarea page golden)
  script: cd tdesign-component/example && flutter test --no-pub test/form_input_textarea_page_golden_test.dart

# Switch 完整 Demo 页面及亮暗 Golden，以 Flutter 3.32.0 Linux 为权威环境。
.switch-page-golden:
  name: flutter test (switch page golden)
  script: cd tdesign-component/example && flutter test --no-pub test/switch_page_test.dart

# APK 构建
.build-apk:
  name: flutter build apk
  script: cd tdesign-component/example && flutter build apk -t ./lib/main.dart --release

# Web 构建
.build-web:
  name: flutter build web
  script: cd tdesign-component/example && flutter build web -t ./lib/main.dart --release

# ===== 完整 CI pipeline 模板（供事件侧逐条 !reference 引用）=====
# 每个模板是完整的 Pipeline 对象（含 name / docker / stages），
# 与上面 stage 片段组合使用，避免在 .cnb.yml 中重复书写整套构建 job。

# 同步到 GitHub（develop / $ 兜底 push 共用）
.sync-to-github:
  imports:
    - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
  stages:
    - name: sync to github with rebase
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/Tencent/tdesign-flutter.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}

# 静态分析：flutter 3.32.0
.analyze-332:
  name: analyze (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 静态分析：flutter latest
.analyze-latest:
  name: analyze (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 测试 + 覆盖率：flutter 3.32.0
.test-332:
  name: test (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.component-regression-tests]
    - !reference [.regression-tool-tests]
    - !reference [.refresh-demo-tests]
    - !reference [.refresh-golden]
    - !reference [.upload-tests]
    - !reference [.form-input-page-golden]
    - !reference [.switch-page-golden]

# 测试 + 覆盖率：flutter latest
.test-latest:
  name: test (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.component-regression-tests]
    - !reference [.regression-tool-tests]

# 构建 APK：flutter 3.32.0
.build-apk-332:
  name: build apk (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.gradle:cow
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.build-apk]

# 构建 APK：flutter latest
.build-apk-latest:
  name: build apk (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.gradle:cow
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.build-apk]

# 构建 Web：flutter 3.32.0
.build-web-332:
  name: build web (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.build-web]

# 构建 Web：flutter latest
.build-web-latest:
  name: build web (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.build-web]
