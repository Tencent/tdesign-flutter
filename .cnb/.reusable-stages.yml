# ===== 公共可复用片段（以 . 开头，不会被识别为分支名）=====
# 本文件由 .cnb.yml 通过 include + !reference 引入使用

# 安装组件依赖
.install-component:
  name: install component dependencies
  script: cd tdesign-component && flutter pub get

# 安装示例依赖
.install-example:
  name: install example dependencies
  script: cd tdesign-component/example && flutter pub get

# 静态分析：lint 零告警（0 error / 0 warning / 0 info）。
# 启用 --fatal-infos，任何 info 级告警都会阻断构建，作为 lint 零告警的机器硬门槛。
# （存量 deprecated 告警已在本 PR 逐项清零，故可开启严格模式。）
.analyze:
  name: flutter analyze
  script: cd tdesign-component && flutter analyze --fatal-infos

.component-regression-tests:
  name: flutter test (component regression)
  script: cd tdesign-component && dart run tool/run_component_regression.dart

.regression-tool-tests:
  name: flutter test (regression tooling)
  script: cd tdesign-component && flutter test --no-pub test/tool/check_component_coverage_test.dart test/tool/run_component_regression_test.dart test/tool/run_visual_regression_test.dart

# Example 页面共享功能回归，双 Flutter 版本共用；不包含 Golden。
.example-regression-tests:
  name: flutter test (example shared regression)
  script: cd tdesign-component/example && flutter test --no-pub --exclude-tags golden test/widget_test.dart test/action_sheet_page_test.dart test/badge_page_test.dart test/calendar_demo_test.dart test/date_time_picker_demo_test.dart test/dialog_page_test.dart test/dropdown_menu_page_test.dart test/loading_demo_test.dart test/message_demo_test.dart test/notice_bar_page_test.dart test/picker_demo_test.dart test/popup_demo_test.dart test/popover_demo_test.dart test/popover_page_test.dart test/radio_page_test.dart test/rate_demo_test.dart test/tabs_page_test.dart test/tag_page_test.dart

# Demo 结构与 Golden 固定在 Flutter 3.32.0 Linux 执行，测试清单由 Dart 统一维护。
.visual-regression-tests:
  name: flutter test (visual regression)
  script: cd tdesign-component && dart run tool/run_visual_regression.dart

# APK 构建
.build-apk:
  name: flutter build apk
  script: cd tdesign-component/example && flutter build apk -t ./lib/main.dart --release

# Web 构建
.build-web:
  name: flutter build web
  script: cd tdesign-component/example && flutter build web -t ./lib/main.dart --release

# ===== 完整 CI pipeline 模板（供事件侧逐条 !reference 引用）=====
# 每个模板是完整的 Pipeline 对象（含 name / docker / stages），
# 与上面 stage 片段组合使用，避免在 .cnb.yml 中重复书写整套构建 job。

# 同步到 GitHub（develop / $ 兜底 push 共用）
.sync-to-github:
  imports:
    - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
  stages:
    - name: sync to github with rebase
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/Tencent/tdesign-flutter.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}

# 静态分析：flutter 3.32.0
.analyze-332:
  name: analyze (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 静态分析：flutter latest
.analyze-latest:
  name: analyze (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 测试 + 覆盖率：flutter 3.32.0
.test-332:
  name: test (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.component-regression-tests]
    - !reference [.regression-tool-tests]
    - !reference [.example-regression-tests]
    - !reference [.visual-regression-tests]

# 测试 + 覆盖率：flutter latest
.test-latest:
  name: test (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.component-regression-tests]
    - !reference [.regression-tool-tests]
    - !reference [.example-regression-tests]

# 构建 APK：flutter 3.32.0
.build-apk-332:
  name: build apk (flutter 3.32.0)
