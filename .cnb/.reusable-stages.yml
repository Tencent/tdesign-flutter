# ===== 公共可复用片段（以 . 开头，不会被识别为分支名）=====
# 本文件由 .cnb.yml 通过 include + !reference 引入使用

# 安装组件依赖
.install-component:
  name: install component dependencies
  script: cd tdesign-component && flutter pub get

# 安装示例依赖
.install-example:
  name: install example dependencies
  script: cd tdesign-component/example && flutter pub get

# 静态分析：lint 零告警（0 error / 0 warning / 0 info）。
# 启用 --fatal-infos，任何 info 级告警都会阻断构建，作为 lint 零告警的机器硬门槛。
# （存量 deprecated 告警已在本 PR 逐项清零，故可开启严格模式。）
.analyze:
  name: flutter analyze
  script: cd tdesign-component && flutter analyze --fatal-infos

# 单元 / Widget 测试：运行 refresh 相关测试（生产源码覆盖率门禁在此产出）。
# 仅跑 refresh 目录的测试，避免无关测试影响速度；`--coverage` 产出 lcov.info。
.test:
  name: flutter test (refresh)
  script: |
    set -eu
    cd tdesign-component
    flutter test test/components/refresh/t_refresh_test.dart --coverage
    # 过滤 refresh 生产源码并校验 LH/LF >= 95%
    dart run tool/check_component_coverage.dart refresh

.refresh-component-tests-latest:
  name: flutter test (refresh component)
  script: |
    set -eu
    cd tdesign-component
    flutter test test/components/refresh/t_refresh_test.dart --exclude-tags demo --coverage
    dart run tool/check_component_coverage.dart refresh

# Refresh Golden 固定在 Flutter 3.32.0 Linux，以 0% 像素差异严格比较。
.refresh-golden:
  name: flutter test (refresh golden)
  script: cd tdesign-component && flutter test test/components/refresh/t_refresh_golden_test.dart

# Upload Golden 固定在 Flutter 3.32.0 Linux 环境执行。
.upload-tests:
  name: flutter test (upload golden)
  script: cd tdesign-component && flutter test test/components/upload/t_upload_golden_test.dart

# Form / Input / Textarea 完整 Demo 页面 Golden 固定在 Flutter 3.32.0 执行。
# 复用单套标准基线和受控跨平台比较器，并由测试严格校验页面结构与几何。
.form-input-page-golden:
  name: flutter test (form input textarea page golden)
  script: cd tdesign-component/example && flutter test test/form_input_textarea_page_golden_test.dart

# Switch 组件行为与生产源码覆盖率门禁，在两个 Flutter 版本执行。
.switch-component-tests:
  name: flutter test (switch component)
  script: |
    cd tdesign-component
    flutter test test/components/switch/t_switch_test.dart test/components/switch/t_cupertino_switch_test.dart --coverage
    dart run tool/check_component_coverage.dart switch

.upload-component-tests:
  name: flutter test (upload component)
  script: |
    cd tdesign-component
    flutter test test/components/upload/t_upload_test.dart --coverage
    dart run tool/check_component_coverage.dart upload

.form-component-tests:
  name: flutter test (form component)
  script: |
    cd tdesign-component
    flutter test test/components/form/t_form_test.dart --coverage
    dart run tool/check_component_coverage.dart form

.input-component-tests:
  name: flutter test (input component)
  script: |
    cd tdesign-component
    flutter test test/components/input/t_input_test.dart test/components/input/t_input_theme_test.dart --coverage
    dart run tool/check_component_coverage.dart input

.textarea-component-tests:
  name: flutter test (textarea component)
  script: |
    cd tdesign-component
    flutter test test/components/textarea/t_textarea_test.dart --coverage
    dart run tool/check_component_coverage.dart textarea

.coverage-checker-tests:
  name: flutter test (coverage checker)
  script: cd tdesign-component && flutter test test/tool/check_component_coverage_test.dart

# Switch 完整 Demo 页面及亮暗 Golden，以 Flutter 3.32.0 Linux 为权威环境。
.switch-page-golden:
  name: flutter test (switch page golden)
  script: cd tdesign-component/example && flutter test test/switch_page_test.dart

# APK 构建
.build-apk:
  name: flutter build apk
  script: cd tdesign-component/example && flutter build apk -t ./lib/main.dart --release

# Web 构建
.build-web:
  name: flutter build web
  script: cd tdesign-component/example && flutter build web -t ./lib/main.dart --release

# ===== 完整 CI pipeline 模板（供事件侧逐条 !reference 引用）=====
# 每个模板是完整的 Pipeline 对象（含 name / docker / stages），
# 与上面 stage 片段组合使用，避免在 .cnb.yml 中重复书写整套构建 job。

# 同步到 GitHub（develop / $ 兜底 push 共用）
.sync-to-github:
  imports:
    - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
  stages:
    - name: sync to github with rebase
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/Tencent/tdesign-flutter.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}

# 静态分析：flutter 3.32.0
.analyze-332:
  name: analyze (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 静态分析：flutter latest
.analyze-latest:
  name: analyze (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.analyze]

# 测试 + 覆盖率：flutter 3.32.0
.test-332:
  name: test (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.test]
    - !reference [.refresh-golden]
    - !reference [.switch-component-tests]
    - !reference [.upload-component-tests]
    - !reference [.form-component-tests]
    - !reference [.input-component-tests]
    - !reference [.textarea-component-tests]
    - !reference [.coverage-checker-tests]
    - !reference [.upload-tests]
    - !reference [.form-input-page-golden]
    - !reference [.switch-page-golden]

# 测试 + 覆盖率：flutter latest
.test-latest:
  name: test (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.refresh-component-tests-latest]
    - !reference [.switch-component-tests]
    - !reference [.upload-component-tests]
    - !reference [.form-component-tests]
    - !reference [.input-component-tests]
    - !reference [.textarea-component-tests]
    - !reference [.coverage-checker-tests]

# 构建 APK：flutter 3.32.0
.build-apk-332:
  name: build apk (flutter 3.32.0)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
    volumes:
      - /root/.gradle:cow
      - /root/.pub-cache:cow
  stages:
    - !reference [.install-component]
    - !reference [.install-example]
    - !reference [.build-apk]

# 构建 APK：flutter latest
.build-apk-latest:
  name: build apk (flutter latest)
  docker:
    image: docker.cnb.cool/liweijie0812/docker/flutter-latest
    volumes:
      - /root/.gradle:cow
      - /root/.pub-cache:cow
  stages:
