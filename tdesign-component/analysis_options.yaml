include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.50 将 material/cupertino 收敛到独立包并标记旧入口为废弃，
    # 全仓迁移属于长线工程；先降级该 info，避免 --fatal-infos 卡死所有 PR 的 CI。
    deprecated_member_use: ignore
    depend_on_referenced_packages: ignore
    overridden_fields: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# https://dart.dev/tools/linter-rules
linter:
  rules:
    # 控制结构的语句体另起一行
    - always_put_control_body_on_new_line
    # 可变类不要重载 == 和 hashCode
    - avoid_equals_and_hash_code_on_mutable_classes
    # 重载 == 时不必判空
    - avoid_null_checks_in_equality_operators
    # 不要返回 this 来实现链式调用
    - avoid_returning_this
    # 避免单独使用 setter 而没有 getter
    - avoid_setters_without_getters
    # 避免使用 dart:io 中较慢的异步方法
    - avoid_slow_async_io
    # 不再使用的 StreamSubscription 要调用 cancel
    - cancel_subscriptions
    # 不再使用的 Sink 要调用 close
    - close_sinks
    # 文档注释只引用作用域内的标识符
    - comment_references
    # import / export 指令按规范排序
    - directives_ordering
    # 库名使用小写加下划线命名
    - library_names
    # 避免只由字面量组成的布尔表达式
    - literal_only_boolean_expressions
    # 不要在列表里使用相邻字符串拼接
    - no_adjacent_strings_in_list
    # 省略局部变量的类型声明
    - omit_local_variable_types
    # 能用 const 构造时用 const
    - prefer_const_constructors
    # 优先用 const 而不是 final 声明
    - prefer_const_declarations
    # 给 @immutable 类传参时优先用 const 字面量
    - prefer_const_literals_to_create_immutables
    # 优先使用 mixin 而非继承
    - prefer_mixin
    # lib/ 下优先使用相对路径导入
    - prefer_relative_imports
    # 字符串优先使用单引号（含单引号时可用双引号）
    - prefer_single_quotes
    # 无需返回值时用 void 而不是 Null
    - prefer_void_to_null
    # 重载 == 时先判断入参类型
    - test_types_in_equals
    # 避免在 finally 中抛出异常
    - throw_in_finally
    # async 函数中的 Future 要 await 或显式标记 unawaited
    - unawaited_futures
    # 不要用 lambda 替代 tear-off
    - unnecessary_lambdas
    # 避免无意义的语句
    - unnecessary_statements
