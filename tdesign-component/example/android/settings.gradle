pluginManagement {
    // 动态获取 Flutter SDK 路径
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        return properties.getProperty("flutter.sdk")
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    // 引入 Flutter 插件加载机制
    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    apply from: "${rootDir}/app/version.gradle" // 加载 version.gradle 脚本
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" // 声明式加载插件
    id "com.android.application" version "9.1.1" apply false // Flutter latest 要求 AGP 不低于 9.1.1
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false // Kotlin 版本需兼容 AGP
}

include ":app"
