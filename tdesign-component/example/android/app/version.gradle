// Flutter writes --build-name/--build-number to local.properties before Gradle runs.
ext.createVersionName = { ->
    def versionFile = file("../../assets/version")
    if (!versionFile.exists() || versionFile.text.trim().isEmpty()) {
        throw new GradleException("Missing Demo version; run dart ../tool/write_demo_build_info.dart before building")
    }
    return versionFile.text.trim()
}
