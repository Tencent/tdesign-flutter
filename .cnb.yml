# 引入公共可复用片段（见 .cnb/.reusable-stages.yml）
# 完整的 CI pipeline 模板（sync + analyze / build apk / build web × flutter 3.32.0 & latest）
# 都在该文件中定义，此处事件侧仅用 !reference 逐条引用，避免重复书写。
include:
  - .cnb/.reusable-stages.yml

# ================= 分支触发配置 =================
# develop 分支 push：同步到 GitHub + 跑与 pull_request 一致的完整 CI
develop:
  push:
    - !reference [.sync-to-github]
    - !reference [.analyze-332]
    - !reference [.analyze-latest]
    - !reference [.build-apk-332]
    - !reference [.build-apk-latest]
    - !reference [.build-web-332]
    - !reference [.build-web-latest]

$:
  push:
    # 其他分支 push：仅同步到 GitHub
    - !reference [.sync-to-github]

  pull_request:
    # 静态分析 / 构建 APK / 构建 Web（flutter 3.32.0 与 latest 两个版本）
    - !reference [.analyze-332]
    - !reference [.analyze-latest]
    - !reference [.build-apk-332]
    - !reference [.build-apk-latest]
    - !reference [.build-web-332]
    - !reference [.build-web-latest]

  # 分支被删除时，自动关闭分支名中关联的 Issue（如 rss1102/cnb-issue-31/fix/xxx）
  # 注意：branch.delete 事件使用【默认分支】的最新代码和配置（被删分支已不存在）
  branch.delete:
    - stages:
        - name: extract issue id from branch
          script: |
            # 从被删除分支名中解析关联 Issue 编号，支持 cnb-issue-N / issue-N / #N 格式
            ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '(cnb-)?issue[-_]?[0-9]+' | grep -oE '[0-9]+' | head -1)
            if [ -z "$ISSUE_ID" ]; then
              ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | head -1)
            fi
            if [ -n "$ISSUE_ID" ]; then
              echo "##[set-output ISSUE_REF=#${ISSUE_ID}]"
              echo "Found linked issue: #${ISSUE_ID} in branch $CNB_BRANCH"
            else
              echo "No linked issue found in branch: $CNB_BRANCH"
            fi
          exports:
            ISSUE_REF: ISSUE_REF

        - name: close linked issue
          type: git:issue-update
          options:
            fromText: $ISSUE_REF
            state: close
          if: '[ -n "$ISSUE_REF" ]'

  # 启动预览：仅预览模式打开分支 Flutter Web 预览（构建 example 并监听 8686）
  web_trigger_launch_preview:
    - docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env
        volumes:
          - /root/.pub-cache:cow
      services:
        - name: vscode
          options:
            onlyPreview: true
            # 业务服务须监听 8686，由 launch-preview.sh 构建产物并启动；
            # launch 末尾的服务常驻前台，须 daemon 后台运行避免阻塞超时。
            launch: sh .cnb/launch-preview.sh
            daemon: true
            keepAliveTimeout: 2h
      stages:
        - name: preview ready
          script: |
            echo "preview build/web:"
            ls -la tdesign-component/example/build/web 2>/dev/null || echo "(build/web 将由 launch 在首次请求前构建)"

  # 云原生开发：仅预览模式不支持 WebIDE，此事件进入标准 WebIDE 用于编辑代码
  vscode:
    - docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env
        volumes:
          - /root/.pub-cache:cow
      services:
        - vscode
        - docker
      stages:
        - name: install component dependencies
          script: cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: cd tdesign-component/example && flutter pub get

        - name: install site dependencies
          script: cd tdesign-site && pnpm install
