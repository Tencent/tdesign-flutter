# ===== 公共可复用片段（以 . 开头，不会被识别为分支名）=====

# 安装组件依赖
.install-component: &install-component
  name: install component dependencies
  script: cd tdesign-component && flutter pub get

# 安装示例依赖
.install-example: &install-example
  name: install example dependencies
  script: cd tdesign-component/example && flutter pub get

# 静态分析：lint 零告警（0 error / 0 warning / 0 info）。
# 启用 --fatal-infos，任何 info 级告警都会阻断构建，作为 lint 零告警的机器硬门槛。
# （存量 deprecated 告警已在本 PR 逐项清零，故可开启严格模式。）
.analyze: &analyze
  name: flutter analyze
  script: cd tdesign-component && flutter analyze --fatal-infos

# APK 构建
.build-apk: &build-apk
  name: flutter build apk
  script: cd tdesign-component/example && flutter build apk -t ./lib/main.dart --release

# Web 构建
.build-web: &build-web
  name: flutter build web
  script: cd tdesign-component/example && flutter build web -t ./lib/main.dart --release

$:
  push:
    # 导入密钥仓库文件为环境变量
    - imports:
        - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Tencent/tdesign-flutter.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

  pull_request:
    # 构建 APK
    - name: build apk (flutter 3.32.0)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      stages:
        - *install-component
        - *analyze
        - *install-example
        - *build-apk

    - name: build apk (flutter latest)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-latest
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      stages:
        - *install-component
        - *analyze
        - *install-example
        - *build-apk

    # 构建 Web
    - name: build web (flutter 3.32.0)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
        volumes:
          - /root/.pub-cache:cow
      stages:
        - *install-component
        - *analyze
        - *install-example
        - *build-web

    # 构建 Web（flutter latest）
    - name: build web (flutter latest)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-latest
        volumes:
          - /root/.pub-cache:cow
      stages:
        - *install-component
        - *analyze
        - *install-example
        - *build-web

  # 分支被删除时，自动关闭分支名中关联的 Issue（如 rss1102/cnb-issue-31/fix/xxx）
  # 注意：branch.delete 事件使用【默认分支】的最新代码和配置（被删分支已不存在）
  branch.delete:
    - stages:
        - name: extract issue id from branch
          script: |
            # 从被删除分支名中解析关联 Issue 编号，支持 cnb-issue-N / issue-N / #N 格式
            ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '(cnb-)?issue[-_]?[0-9]+' | grep -oE '[0-9]+' | head -1)
            if [ -z "$ISSUE_ID" ]; then
              ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | head -1)
            fi
            if [ -n "$ISSUE_ID" ]; then
              echo "##[set-output ISSUE_REF=#${ISSUE_ID}]"
              echo "Found linked issue: #${ISSUE_ID} in branch $CNB_BRANCH"
            else
              echo "No linked issue found in branch: $CNB_BRANCH"
            fi
          exports:
            ISSUE_REF: ISSUE_REF

        - name: close linked issue
          type: git:issue-update
          options:
            fromText: $ISSUE_REF
            state: close
          if: '[ -n "$ISSUE_REF" ]'

  vscode:
    - docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: install component dependencies
          script: cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: cd tdesign-component/example && flutter pub get

        - name: install site dependencies
          script: cd tdesign-site && pnpm install
