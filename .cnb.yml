# 引入公共可复用片段（见 .cnb/.reusable-stages.yml）
# 完整的 CI pipeline 模板（sync + analyze / build apk / build web × flutter 3.32.0 & latest）
# 都在该文件中定义，此处事件侧仅用 !reference 逐条引用，避免重复书写。
include:
  - .cnb/.reusable-stages.yml

# ================= 分支触发配置 =================
# develop 分支 push：同步到 GitHub + 跑与 pull_request 一致的完整 CI
develop:
  push:
    - !reference [.sync-to-github]
    - !reference [.analyze-332]
    - !reference [.analyze-latest]
    - !reference [.build-apk-332]
    - !reference [.build-apk-latest]
    - !reference [.build-web-332]
    - !reference [.build-web-latest]

$:
  push:
    # 其他分支 push：仅同步到 GitHub
    - !reference [.sync-to-github]

  pull_request:
    # 静态分析 / 构建 APK / 构建 Web（flutter 3.32.0 与 latest 两个版本）
    - !reference [.analyze-332]
    - !reference [.analyze-latest]
    - !reference [.build-apk-332]
    - !reference [.build-apk-latest]
    - !reference [.build-web-332]
    - !reference [.build-web-latest]

  # 分支被删除时，自动关闭分支名中关联的 Issue（如 rss1102/cnb-issue-31/fix/xxx）
  # 注意：branch.delete 事件使用【默认分支】的最新代码和配置（被删分支已不存在）
  branch.delete:
    - stages:
        - name: extract issue id from branch
          script: |
            # 从被删除分支名中解析关联 Issue 编号，支持 cnb-issue-N / issue-N / #N 格式
            ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '(cnb-)?issue[-_]?[0-9]+' | grep -oE '[0-9]+' | head -1)
            if [ -z "$ISSUE_ID" ]; then
              ISSUE_ID=$(echo "$CNB_BRANCH" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | head -1)
            fi
            if [ -n "$ISSUE_ID" ]; then
              echo "##[set-output ISSUE_REF=#${ISSUE_ID}]"
              echo "Found linked issue: #${ISSUE_ID} in branch $CNB_BRANCH"
            else
              echo "No linked issue found in branch: $CNB_BRANCH"
            fi
          exports:
            ISSUE_REF: ISSUE_REF

        - name: close linked issue
          type: git:issue-update
          options:
            fromText: $ISSUE_REF
            state: close
          if: '[ -n "$ISSUE_REF" ]'

  # 分支预览（Issue #93）：在任意分支详情页点击「云原生开发」按钮，
  # 通过云原生开发「仅预览模式」（onlyPreview）直接打开该分支代码的预览页面。
  # 点击后不再进入 WebIDE，而是构建 example 的 Flutter Web 产物并在 8686 端口
  # 以静态服务形式对外提供预览（see https://docs.cnb.cool/zh/workspaces/only-preview.md）。
  # 纯 CI 改动，不引入外部服务，不影响 flutter@3.32.0 / latest 双版本构建。
  vscode:
    - docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-3.32.0
        volumes:
          - /root/.pub-cache:cow
      services:
        - name: vscode
          options:
            onlyPreview: true
            # 业务服务必须监听 8686 端口：若构建产物尚不存在则先构建再启动静态服务
            launch: cd tdesign-component/example && { [ -d build/web ] || { flutter pub get && flutter build web -t ./lib/main.dart --release; }; } && node ../../scripts/preview-server.mjs build/web 8686
            keepAliveTimeout: 2h
      stages:
        - name: build example web
          script: |
            cd tdesign-component
            flutter pub get
            cd example
            flutter pub get
            flutter build web -t ./lib/main.dart --release
