# ===== 公共可复用片段（以 . 开头，不会被识别为分支名）=====

# git safe.directory 全局配置 + 腾讯云镜像源（env 方式）
.git-safe-env: &git-safe-env
  env:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
    PUB_HOSTED_URL: "https://mirrors.tencent.com/dart-pub"
    FLUTTER_STORAGE_BASE_URL: "https://mirrors.tencent.com/flutter"

# 安装组件依赖
.install-component: &install-component
  name: install component dependencies
  script: cd tdesign-component && flutter pub get

# 安装示例依赖
.install-example: &install-example
  name: install example dependencies
  script: cd tdesign-component/example && flutter pub get

# APK 构建（含腾讯云 Gradle/Maven 镜像加速）
.build-apk: &build-apk
  name: flutter build apk
  script: |
    cd tdesign-component/example

    # 1) Gradle 发行版走腾讯云镜像加速下载
    sed -i 's#services.gradle.org/distributions#mirrors.cloud.tencent.com/gradle#' \
      android/gradle/wrapper/gradle-wrapper.properties

    # 1.5) 增大 Gradle JVM 堆内存，避免 JetifyTransform 处理引擎 jar 时 Java heap space
    sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m/' \
      android/gradle.properties

    # 2) Gradle init script 全量镜像
    #    注意：不要在 settingsEvaluated 中向 pluginManagement.repositories 追加 maven 仓库。
    #    Flutter 的 settings.gradle 已显式声明 pluginManagement.repositories，Gradle 8.11+
    #    会因 "prefer settings repositories over project repositories" 校验失败。
    #    因此仅镜像 allprojects（依赖）仓库，构建插件走 settings.gradle 自带的
    #    google/mavenCentral/gradlePluginPortal。
    mkdir -p ~/.gradle
    cat > ~/.gradle/init.gradle <<'EOF'
    allprojects {
        repositories {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/google/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-central/' }
            maven { url 'https://mirrors.tencent.com/nexus/repository/gradle-plugins/' }
        }
    }
    EOF

    # 3) Gradle 优化参数
    cat > ~/.gradle/gradle.properties <<'EOF'
    org.gradle.parallel=true
    org.gradle.caching=true
    org.gradle.configureondemand=true
    org.gradle.daemon=false
    EOF

    flutter build apk -t ./lib/main.dart --release

# Web 构建
.build-web: &build-web
  name: flutter build web
  script: cd tdesign-component/example && flutter build web -t ./lib/main.dart --release

$:
  push:
    # 导入密钥仓库文件为环境变量
    - imports:
        - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Tencent/tdesign-flutter.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

  pull_request:
    # 构建 APK，使用 gmeligio/flutter-android 镜像（Docker Hub）
    - name: build apk (flutter 3.32.0)
      runner:
        cpus: 16
      docker:
        image: gmeligio/flutter-android:3.32.0
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      <<: *git-safe-env
      stages:
        - *install-component
        - *install-example
        - *build-apk

    - name: build apk (flutter latest)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-latest
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      <<: *git-safe-env
      stages:
        - *install-component
        - *install-example
        - *build-apk

    # 构建 Web，使用项目开发环境镜像（自带 Flutter 3.32.0，与 .fvmrc 一致）
    - name: build web (flutter 3.32.0)
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env:latest
      <<: *git-safe-env
      stages:
        - *install-component
        - *install-example
        - *build-web

    # 构建 Web（flutter latest）
    - name: build web (flutter latest)
      docker:
        image: docker.cnb.cool/liweijie0812/docker/flutter-latest
      <<: *git-safe-env
      stages:
        - *install-component
        - *install-example
        - *build-web

  vscode:
    - docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: install component dependencies
          script: cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: cd tdesign-component/example && flutter pub get

        - name: install site dependencies
          script: cd tdesign-site && pnpm install
