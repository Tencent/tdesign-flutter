$:
  push:
    # 导入密钥仓库文件为环境变量
    - imports:
        - https://cnb.cool/tencent/tdesign/tdesign-private/-/blob/main/cnb-envs.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Tencent/tdesign-flutter.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

  pull_request:
    # 构建 APK，使用 gmeligio/flutter-android 镜像（Docker Hub）
    - name: build apk (flutter 3.32.0)
      runner:
        cpus: 16
      docker:
        image: gmeligio/flutter-android:3.32.0
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
      stages:
        - name: install component dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter pub get

        - name: flutter build apk
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example

            # 1) Gradle 发行版走腾讯云镜像加速下载
            sed -i 's#services.gradle.org/distributions#mirrors.cloud.tencent.com/gradle#' \
              android/gradle/wrapper/gradle-wrapper.properties

            # 2) 依赖仓库走腾讯云镜像（Gradle init script）
            mkdir -p ~/.gradle
            cat > ~/.gradle/init.gradle <<'EOF'
            allprojects {
                repositories {
                    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
                    maven { url 'https://mirrors.tencent.com/nexus/repository/gradle-plugins/' }
                }
            }
            EOF

            flutter build apk -t ./lib/main.dart --release --verbose

    - name: build apk (flutter latest)
      runner:
        cpus: 16
      docker:
        image: gmeligio/flutter-android:3.44.9
        volumes:
          - /root/.gradle:cow
          - /root/.pub-cache:cow
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
      stages:
        - name: install component dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter pub get

        - name: flutter build apk
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example

            # 1) Gradle 发行版走腾讯云镜像加速下载
            sed -i 's#services.gradle.org/distributions#mirrors.cloud.tencent.com/gradle#' \
              android/gradle/wrapper/gradle-wrapper.properties

            # 2) 依赖仓库走腾讯云镜像（Gradle init script）
            mkdir -p ~/.gradle
            cat > ~/.gradle/init.gradle <<'EOF'
            allprojects {
                repositories {
                    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
                    maven { url 'https://mirrors.tencent.com/nexus/repository/gradle-plugins/' }
                }
            }
            EOF

            flutter build apk -t ./lib/main.dart --release --verbose

    # 构建 Web，使用项目开发环境镜像（自带 Flutter 3.32.0，与 .fvmrc 一致）
    - name: build web (flutter 3.32.0)
      docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env:latest
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
      stages:
        - name: install component dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter pub get

        - name: flutter build web
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter build web -t ./lib/main.dart --release --verbose

    # 构建 Web（flutter latest），使用 gmeligio/flutter-web 镜像
    - name: build web (flutter latest)
      docker:
        image: gmeligio/flutter-web:3.44.9
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
      stages:
        - name: install component dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter pub get

        - name: flutter build web
          script: |
            git config --global --add safe.directory /home/flutter/sdks/flutter
            cd tdesign-component/example && flutter build web -t ./lib/main.dart --release --verbose

  vscode:
    - docker:
        image: docker.cnb.cool/tencent/tdesign/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: install component dependencies
          script: cd tdesign-component && flutter pub get

        - name: install example dependencies
          script: cd tdesign-component/example && flutter pub get

        - name: install site dependencies
          script: cd tdesign-site && pnpm install
