# TDesign Flutter V1.0 组件自动化验收 CI
#
# 在 PR / push 到 develop 分支时自动执行全部验收检查。
# 与现有 test-build.yml 独立，不干扰现有流水线。

name: acceptance

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "tdesign-component/lib/**"
      - "tdesign-component/test/**"
      - "tdesign-component/scripts/acceptance/**"
      - "tdesign-component/example/lib/**"
      - ".github/workflows/acceptance.yml"
  push:
    branches: [develop]
    paths:
      - "tdesign-component/lib/**"
      - "tdesign-component/test/**"
      - "tdesign-component/scripts/acceptance/**"
      - ".github/workflows/acceptance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  # ============================================================
  # Job 1：静态核查 + 文档一致性
  # ============================================================
  static-checks:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.acceptance.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          cache: true

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: flutter pub get
        working-directory: ./tdesign-component
        run: flutter pub get

      - name: flutter analyze
        working-directory: ./tdesign-component
        run: flutter analyze --no-fatal-infos

      - name: Run acceptance checks (skip tests)
        id: acceptance
        working-directory: ./tdesign-component
        run: dart run scripts/acceptance/acceptance_check.dart --skip-tests --skip-build

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-static
          path: tdesign-component/scripts/acceptance/acceptance-report.md

  # ============================================================
  # Job 2：测试 + 覆盖率（3.32 矩阵）
  # ============================================================
  test-coverage:
    runs-on: ubuntu-latest
    needs: static-checks
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.32.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: flutter pub get
        working-directory: ./tdesign-component
        run: flutter pub get

      - name: flutter test --coverage
        working-directory: ./tdesign-component
        run: flutter test --coverage

      - name: Theme 档2 Widget 测试
        working-directory: ./tdesign-component
        run: flutter test test/acceptance/theme_acceptance_test.dart

      - name: Run full acceptance checks
        working-directory: ./tdesign-component
        run: dart run scripts/acceptance/acceptance_check.dart --skip-build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.flutter-version }}
          path: tdesign-component/coverage/

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-test
          path: tdesign-component/scripts/acceptance/acceptance-report.md

  # ============================================================
  # Job 3：API 文档生成 + 一致性检查
  # ============================================================
  api-doc-consistency:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          cache: true

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: flutter pub get
        working-directory: ./tdesign-component
        run: flutter pub get

      - name: Generate API docs
        working-directory: ./tdesign-component
        run: sh ./demo_tool/all_build.sh

      - name: Run API doc consistency check
        working-directory: ./tdesign-component
        run: dart run scripts/acceptance/acceptance_check.dart --skip-tests

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-docs
          path: tdesign-component/scripts/acceptance/acceptance-report.md

  # ============================================================
  # Job 4：Web 构建（项G）
  # ============================================================
  web-build:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          cache: true

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get

      - name: flutter build web
        working-directory: ./tdesign-component/example
        run: flutter build web -t ./lib/main.dart --release

      - name: Web 构建结果
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Web 构建通过（项G）"
          else
            echo "❌ Web 构建失败"
          fi
