# TDesign Flutter V1 migration acceptance CI.
#
# TEMPORARY MIGRATION COMPATIBILITY: This PR only migrates Theme and the base
# components below. Expand these paths as each component is migrated; do not
# restore full-library checks until the package root exports the full library.
name: acceptance

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "tdesign-component/lib/**"
      - "tdesign-component/test/components/button/**"
      - "tdesign-component/test/components/divider/**"
      - "tdesign-component/test/components/fab/**"
      - "tdesign-component/test/components/icon/**"
      - "tdesign-component/test/components/link/**"
      - "tdesign-component/test/components/text/**"
      - "tdesign-component/example/assets/api/button_api.md"
      - "tdesign-component/example/assets/api/divider_api.md"
      - "tdesign-component/example/assets/api/fab_api.md"
      - "tdesign-component/example/assets/api/icon_api.md"
      - "tdesign-component/example/assets/api/link_api.md"
      - "tdesign-component/example/assets/api/text_api.md"
      - "tdesign-component/example/lib/page/t_button_page.dart"
      - "tdesign-component/example/lib/page/t_divider_page.dart"
      - "tdesign-component/example/lib/page/t_fab_page.dart"
      - "tdesign-component/example/lib/page/t_icon_page.dart"
      - "tdesign-component/example/lib/page/t_link_page.dart"
      - "tdesign-component/example/lib/page/t_text_page.dart"
      - ".github/workflows/acceptance.yml"
  push:
    branches: [develop]
    paths:
      - "tdesign-component/lib/**"
      - "tdesign-component/test/components/button/**"
      - "tdesign-component/test/components/divider/**"
      - "tdesign-component/test/components/fab/**"
      - "tdesign-component/test/components/icon/**"
      - "tdesign-component/test/components/link/**"
      - "tdesign-component/test/components/text/**"
      - "tdesign-component/example/assets/api/button_api.md"
      - "tdesign-component/example/assets/api/divider_api.md"
      - "tdesign-component/example/assets/api/fab_api.md"
      - "tdesign-component/example/assets/api/icon_api.md"
      - "tdesign-component/example/assets/api/link_api.md"
      - "tdesign-component/example/assets/api/text_api.md"
      - "tdesign-component/example/lib/page/t_button_page.dart"
      - "tdesign-component/example/lib/page/t_divider_page.dart"
      - "tdesign-component/example/lib/page/t_fab_page.dart"
      - "tdesign-component/example/lib/page/t_icon_page.dart"
      - "tdesign-component/example/lib/page/t_link_page.dart"
      - "tdesign-component/example/lib/page/t_text_page.dart"
      - ".github/workflows/acceptance.yml"

jobs:
  base-component-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdesign-component
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          cache: true

      - name: tdesign-adaptation
        run: sh ./init.sh

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze migrated foundation and base components
        run: >-
          flutter analyze --no-fatal-infos
          lib/tdesign_flutter.dart
          lib/src/theme
          lib/src/util/map_ext.dart
          lib/src/util/platform_util.dart
          lib/src/components/button
          lib/src/components/divider
          lib/src/components/fab
          lib/src/components/icon
          lib/src/components/link
          lib/src/components/text
          test/components/button
          test/components/divider
          test/components/fab
          test/components/icon
          test/components/link
          test/components/text

      - name: Test migrated base components with coverage
        run: >-
          flutter test --coverage
          test/components/button
          test/components/divider
          test/components/fab
          test/components/icon
          test/components/link
          test/components/text

      - name: Verify migrated demos and API docs
        run: |
          test -f example/assets/api/button_api.md
          test -f example/assets/api/divider_api.md
          test -f example/assets/api/fab_api.md
          test -f example/assets/api/icon_api.md
          test -f example/assets/api/link_api.md
          test -f example/assets/api/text_api.md
          test -f example/lib/page/t_button_page.dart
          test -f example/lib/page/t_divider_page.dart
          test -f example/lib/page/t_fab_page.dart
          test -f example/lib/page/t_icon_page.dart
          test -f example/lib/page/t_link_page.dart
          test -f example/lib/page/t_text_page.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-base-components
          path: tdesign-component/coverage/
