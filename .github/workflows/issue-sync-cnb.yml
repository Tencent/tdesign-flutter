# 将 GitHub 仓库的 Issue 单侧同步到 CNB 仓库
#
# 同步规则（与需求对齐）：
#   1. 只同步第一层：创建时同步 标题 + 正文(第一层) + 标签；
#   2. 后续编辑（edited）不同步，GitHub 侧的内容更新不会再次推送到 CNB；
#   3. 关闭联动：GitHub 侧关闭 issue 时，同步关闭 CNB 侧对应的 issue。
#
# 触发事件只监听 opened / closed，不监听 edited，天然满足"后续更新不继续同步"。
#
# 实现方式：
#   - 所有 CNB 侧操作均通过 CNB CLI（@cnbcool/cnb-cli，npm 安装）完成，不再直连 OpenAPI；
#   - 工作流拆分为多个 step，按事件类型（opened / closed）条件执行。
name: issue-sync-cnb

on:
  issues:
    types: [opened, closed]

jobs:
  sync-issue-to-cnb:
    runs-on: ubuntu-latest
    # 只对非 PR 的 issue 生效（GitHub 的 PR 也会触发 issues 事件，需排除）
    if: github.event.issue.pull_request == null
    env:
      # CNB CLI 会自动读取 CNB_TOKEN / CNB_API_ENDPOINT 环境变量
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_ENDPOINT: https://api.cnb.cool
      # CNB 仓库路径，格式：组织/仓库
      CNB_REPO: tencent/tdesign/tdesign-flutter
    steps:
      # ---- 0. 准备：检出仓库并安装 CNB CLI（npm）----
      - uses: actions/checkout@v4

      - name: Install CNB CLI
        run: npm install @cnbcool/cnb-cli -g

      # ---- 1. 数据准备：仅读取 GitHub 事件上下文，不调用 CNB ----
      - name: Prepare issue payload
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { issue } = context.payload;
            const ghNumber = issue.number;

            // 关联键：用标签 "gh-issue-<number>" 把 GitHub issue 映射到 CNB issue
            const mapLabel = `gh-issue-${ghNumber}`;
            core.setOutput('map_label', mapLabel);
            core.setOutput('gh_number', String(ghNumber));

            // 标题写入文件，避免 shell 特殊字符/引号问题
            fs.writeFileSync('/tmp/issue-title.txt', issue.title || '');

            // 组装正文：第一层正文 + 来源信息（GitHub 创建人 / 编号）
            const ghAuthor = issue.user ? `@${issue.user.login}` : '未知用户';
            const body =
              (issue.body || '') +
              '\n\n---\n' +
              `> 本 Issue 由 GitHub 自动同步创建。\n` +
              `> 来源：GitHub [${ghNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${ghNumber})\n` +
              `> 创建人：${ghAuthor}（CNB 侧创建人为同步机器人账号）\n`;
            fs.writeFileSync('/tmp/issue-body.md', body);

            // 标签：始终带上映射标签（关闭联动/防重复依据）；
            // 同步的 GH 标签预留 1 个空位给映射标签，保证总数不超过 CLI 上限(10)。
            const ghLabels = (issue.labels || []).map(l => l.name).slice(0, 9);
            const allLabels = [mapLabel, ...ghLabels].slice(0, 10);
            fs.writeFileSync('/tmp/labels.txt', allLabels.join('\n'));

      # ---- 2. opened：确保所需标签在 CNB 仓库存在（幂等，重复创建视为成功）----
      - name: Ensure labels exist on CNB
        if: github.event.action == 'opened'
        run: |
          set +e
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            # 已存在时 post-label 返回 201 或失败，均视为可用
            cnb repo-labels post-label \
              --repo "$CNB_REPO" \
              --name "$label" \
              --color 5319e7 \
              --description "auto-synced from GitHub issue"
          done < /tmp/labels.txt
          exit 0

      # ---- 3. opened：幂等检查，按映射标签查找已存在的 open issue ----
      - name: Find existing CNB issue
        id: find
        if: github.event.action == 'opened'
        run: |
          existing="$(cnb issues list-issues \
            --repo "$CNB_REPO" \
            --labels "${{ steps.prepare.outputs.map_label }}" \
            --state open \
            --page-size 20 -v \
            | jq -r '.data[]?.number // empty' | head -1)"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      # ---- 4. opened：创建 CNB issue（若已存在则跳过）----
      - name: Create CNB issue
        if: github.event.action == 'opened' && steps.find.outputs.existing == ''
        run: |
          args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            args+=(--labels "$label")
          done < /tmp/labels.txt
          cnb issues create-issue \
            --repo "$CNB_REPO" \
            --title "$(cat /tmp/issue-title.txt)" \
            --body-file /tmp/issue-body.md \
            "${args[@]}"
          echo "Created CNB issue for GitHub #${{ github.event.issue.number }}"

      # ---- 5. closed：按映射标签查找待关闭的 open issue ----
      - name: Find CNB issue to close
        id: find_close
        if: github.event.action == 'closed'
        run: |
          number="$(cnb issues list-issues \
            --repo "$CNB_REPO" \
            --labels "${{ steps.prepare.outputs.map_label }}" \
            --state open \
            --page-size 20 -v \
            | jq -r '.data[]?.number // empty' | head -1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # ---- 6. closed：关闭对应的 CNB issue ----
      - name: Close CNB issue
        if: github.event.action == 'closed' && steps.find_close.outputs.number != ''
        run: |
          cnb issues update-issue \
            --repo "$CNB_REPO" \
            --number "${{ steps.find_close.outputs.number }}" \
            --state closed \
            --state-reason completed
          echo "Closed CNB issue #${{ steps.find_close.outputs.number }}"
