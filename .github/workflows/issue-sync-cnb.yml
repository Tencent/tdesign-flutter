# 将 GitHub 仓库的 Issue 单侧同步到 CNB 仓库
#
# 同步规则（与需求对齐）：
#   1. 只同步第一层：创建时同步 标题 + 正文(第一层) + 标签；
#   2. 后续编辑（edited）不同步，GitHub 侧的内容更新不会再次推送到 CNB；
#   3. 关闭联动：GitHub 侧关闭 issue 时，同步关闭 CNB 侧对应的 issue。
#
# 触发事件只监听 opened / closed，不监听 edited，天然满足"后续更新不继续同步"。
name: issue-sync-cnb

on:
  issues:
    types: [opened, closed]

jobs:
  sync-issue-to-cnb:
    runs-on: ubuntu-latest
    # 只对非 PR 的 issue 生效（GitHub 的 PR 也会触发 issues 事件，需排除）
    if: github.event.issue.pull_request == null
    steps:
      - uses: actions/github-script@v7
        env:
          # 用于调用 CNB API 的访问令牌（需具备目标 CNB 仓库 issue 的读写权限）
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          # CNB 仓库路径，格式：组织/仓库
          CNB_REPO: tencent/tdesign/tdesign-flutter
          # CNB 开放 API 服务地址
          CNB_API: https://api.cnb.cool
        with:
          script: |
            const api = process.env.CNB_API;
            const repo = process.env.CNB_REPO;
            const token = process.env.CNB_TOKEN;

            const ghIssue = context.payload.issue;
            const ghNumber = ghIssue.number;
            const ghAction = context.payload.action;

            // 关联键：用标签 "gh-issue-<number>" 把 GitHub issue 映射到 CNB issue
            const mapLabel = `gh-issue-${ghNumber}`;

            // ---- 工具函数 ----
            const call = async (method, path, body) => {
              const url = `${api}${path}`;
              const resp = await fetch(url, {
                method,
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
                },
                body: body ? JSON.stringify(body) : undefined,
              });
              const text = await resp.text();
              let data = null;
              try { data = text ? JSON.parse(text) : null; } catch { data = text; }
              return { ok: resp.ok, status: resp.status, data };
            };

            // 按标签查找 CNB issue（列表查询，取首个匹配）
            const findCnbIssue = async (state) => {
              const { ok, data } = await call(
                'GET',
                `/${repo}/-/issues?labels=${encodeURIComponent(mapLabel)}&state=${state}&page=1&page_size=20`
              );
              if (ok && Array.isArray(data) && data.length > 0) {
                return data[0];
              }
              // 兼容 data 为 {items: [...]} 之类的包装结构
              if (ok && data && Array.isArray(data.items) && data.items.length > 0) {
                return data.items[0];
              }
              return null;
            };

            // 确保 CNB 仓库存在某个标签（不存在则创建，返回是否可用）
            const ensureLabel = async (name) => {
              const r = await call('POST', `/${repo}/-/labels`, { name });
              // 201 创建成功；409/422 表示已存在或其他原因，视为可用
              return r.ok || r.status === 409 || r.status === 422;
            };

            // ---------- 处理 opened：创建 CNB issue ----------
            if (ghAction === 'opened') {
              // 幂等：若 CNB 侧已存在映射 issue，跳过创建，避免重复
              const existing = await findCnbIssue('open');
              if (existing) {
                console.log(`CNB issue already exists (#${existing.number}), skip creating.`);
                return;
              }

              // 同步标签：先确保 CNB 仓库存在这些标签，再挂到 issue 上
              const ghLabels = (ghIssue.labels || []).map(l => l.name);
              const labels = [];
              for (const name of ghLabels.slice(0, 10)) {
                if (await ensureLabel(name)) labels.push(name);
              }
              // 始终带上映射标签，作为"关闭联动"和防重复的依据
              if (!labels.includes(mapLabel)) {
                await ensureLabel(mapLabel);
                labels.push(mapLabel);
              }

              // 组装正文：第一层正文 + 来源信息（GitHub 创建人 / 编号）
              const ghAuthor = ghIssue.user ? `@${ghIssue.user.login}` : '未知用户';
              const body =
                (ghIssue.body || '') +
                '\n\n---\n' +
                `> 本 Issue 由 GitHub 自动同步创建。\n` +
                `> 来源：GitHub [${ghNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${ghNumber})\n` +
                `> 创建人：${ghAuthor}（CNB 侧创建人为同步机器人账号）\n`;

              const { ok, status, data } = await call(
                'POST',
                `/${repo}/-/issues`,
                { title: ghIssue.title, body, labels }
              );

              if (ok) {
                const no = data && (data.number || data.iid) || 'N/A';
                console.log(`Created CNB issue #${no} for GitHub #${ghNumber}`);
              } else {
                console.log(`Create CNB issue failed. status=${status}, resp=${JSON.stringify(data)}`);
                core.setFailed(`Failed to create CNB issue (status ${status})`);
              }
              return;
            }

            // ---------- 处理 closed：关闭对应的 CNB issue ----------
            if (ghAction === 'closed') {
              const target = await findCnbIssue('open');
              if (!target) {
                console.log(`No open CNB issue with label ${mapLabel}, nothing to close.`);
                return;
              }
              const no = target.number || target.iid;
              const { ok, status, data } = await call(
                'PATCH',
                `/${repo}/-/issues/${no}`,
                { state: 'closed', state_reason: 'completed' }
              );
              if (ok) {
                console.log(`Closed CNB issue #${no} for GitHub #${ghNumber}`);
              } else {
                console.log(`Close CNB issue failed. status=${status}, resp=${JSON.stringify(data)}`);
                core.setFailed(`Failed to close CNB issue #${no} (status ${status})`);
              }
              return;
            }

            console.log(`Unhandled action: ${ghAction}`);
