name: PREVIEW_PUBLISH

on:
  workflow_run:
    workflows: ["PREVIEW_BUILD"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: write

jobs:
  preview-success:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve source PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const matches = pulls.filter((pull) =>
              pull.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              ['develop', 'main'].includes(pull.base.ref) &&
              pull.head.sha === run.head_sha &&
              pull.head.repo?.full_name === run.head_repository.full_name
            );
            if (matches.length !== 1) {
              core.setFailed(`Expected one source PR for ${run.head_sha}, found ${matches.length}`);
              return;
            }
            return String(matches[0].number);

      - name: Download preview metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-env
          path: ${{ runner.temp }}/preview-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate preview metadata
        id: build_env
        shell: bash
        env:
          EXPECTED_PR_NUMBER: ${{ steps.pr.outputs.result }}
        run: |
          set -euo pipefail
          METADATA_FILE="$RUNNER_TEMP/preview-metadata/build-env.txt"
          PR_NUMBER=
          VERSION=
          BUILD_NUMBER=
          SEEN_PR_NUMBER=0
          SEEN_VERSION=0
          SEEN_BUILD_NUMBER=0

          while IFS='=' read -r key value; do
            case "$key" in
              PR_NUMBER)
                (( SEEN_PR_NUMBER == 0 )) || { echo "::error::Duplicate metadata key: $key"; exit 1; }
                PR_NUMBER=$value
                SEEN_PR_NUMBER=1
                ;;
              VERSION)
                (( SEEN_VERSION == 0 )) || { echo "::error::Duplicate metadata key: $key"; exit 1; }
                VERSION=$value
                SEEN_VERSION=1
                ;;
              BUILD_NUMBER)
                (( SEEN_BUILD_NUMBER == 0 )) || { echo "::error::Duplicate metadata key: $key"; exit 1; }
                BUILD_NUMBER=$value
                SEEN_BUILD_NUMBER=1
                ;;
              *)
                echo "::error::Unexpected metadata key: $key"
                exit 1
                ;;
            esac
          done < "$METADATA_FILE"

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          if [ "$PR_NUMBER" != "$EXPECTED_PR_NUMBER" ]; then
            echo "::error::Metadata PR does not match the workflow source PR"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download Web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tdesign-flutter-web
          path: ${{ runner.temp }}/tdesign-flutter-web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve APK artifact URL
        id: apk
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const runId = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifact = data.artifacts.find(
              ({ name, expired }) => name === 'tdesign-flutter-apk' && !expired,
            );
            if (!artifact) {
              core.setFailed(`tdesign-flutter-apk artifact not found in run ${runId}`);
              return;
            }
            return `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}/artifacts/${artifact.id}`;

      - name: Deploy preview to Surge
        id: deploy
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          SURGE_TOKEN: ${{ secrets.TDESIGN_SURGE_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_NAME=${GITHUB_REPOSITORY#*/}
          DEPLOY_DOMAIN="https://preview-pr-${PR_NUMBER}-${PROJECT_NAME}.surge.sh"
          npx --yes surge@0.30.0 \
            --project "$RUNNER_TEMP/tdesign-flutter-web" \
            --domain "$DEPLOY_DOMAIN" \
            --token "$SURGE_TOKEN"
          echo "url=$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Update preview comment
        uses: TDesignOteam/workflows/actions/maintain-one-comment@4e2d1063b106761c54bf9bf58a7502f9017c4b4b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <a href="${{ steps.deploy.outputs.url }}"><img height="96" alt="完成" src="https://user-images.githubusercontent.com/15634204/150816437-9f5bb788-cd67-4cbc-9897-b82d74e9aa65.png" /></a>

            ## Web 预览
            - [文档站点](${{ steps.deploy.outputs.url }})
            - [Demo](${{ steps.deploy.outputs.url }}/flutter/example/)

            ## APK 下载
            - [tdesign-flutter-${{ steps.build_env.outputs.version }}-${{ steps.build_env.outputs.build_number }}.apk](${{ steps.apk.outputs.result }})

            <!-- AUTO_PREVIEW_HOOK -->
          number: ${{ steps.pr.outputs.result }}
          body-include: "<!-- AUTO_PREVIEW_HOOK -->"

      - name: Report publish failure
        if: failure() && steps.pr.outputs.result != ''
        uses: TDesignOteam/workflows/actions/maintain-one-comment@4e2d1063b106761c54bf9bf58a7502f9017c4b4b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img height="96" alt="失败" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            <!-- AUTO_PREVIEW_HOOK -->
          number: ${{ steps.pr.outputs.result }}
          body-include: "<!-- AUTO_PREVIEW_HOOK -->"

  preview-failed:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Resolve source PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const matches = pulls.filter((pull) =>
              pull.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              ['develop', 'main'].includes(pull.base.ref) &&
              pull.head.sha === run.head_sha &&
              pull.head.repo?.full_name === run.head_repository.full_name
            );
            if (matches.length !== 1) {
              core.setFailed(`Expected one source PR for ${run.head_sha}, found ${matches.length}`);
              return;
            }
            return String(matches[0].number);

      - name: Report build failure
        uses: TDesignOteam/workflows/actions/maintain-one-comment@4e2d1063b106761c54bf9bf58a7502f9017c4b4b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img height="96" alt="失败" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">](${{ github.event.workflow_run.html_url }})
            <!-- AUTO_PREVIEW_HOOK -->
          number: ${{ steps.pr.outputs.result }}
          body-include: "<!-- AUTO_PREVIEW_HOOK -->"
