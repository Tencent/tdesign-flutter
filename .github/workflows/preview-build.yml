name: PREVIEW_BUILD

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  setup:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    outputs:
      component_version: ${{ steps.version.outputs.component_version }}
      unique_id: ${{ steps.version.outputs.unique_id }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - name: 配置 Git
        run: git config --global core.symlinks false

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 提取版本信息
        id: version
        run: |
          # 从组件库读取版本号，用于 APK 命名和内部版本显示
          COMPONENT_VERSION=$(grep "^version:" tdesign-component/pubspec.yaml | awk '{print $2}')
          # 生成唯一标识：纯时间戳（秒级），编译时间长不会重复
          UNIQUE_ID=$(date +%Y%m%d%H%M%S)
          # 编译时间戳，用于记录构建时间
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          # 读取 PR 编号（用于 Surge 部署域名）
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BUILD_NUMBER="${{ github.run_id }}"

          echo "component_version=$COMPONENT_VERSION" >> $GITHUB_OUTPUT
          echo "unique_id=$UNIQUE_ID" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          echo "版本: $COMPONENT_VERSION"
          echo "唯一标识: $UNIQUE_ID"

      - name: 生成构建环境变量文件
        # 供 preview-publish.yml 读取，用于 Surge 部署
        run: |
          echo "VERSION=${{ steps.version.outputs.component_version }}" > build-env.txt
          echo "UNIQUE_ID=${{ steps.version.outputs.unique_id }}" >> build-env.txt
          echo "BUILD_NUMBER=${{ github.run_id }}" >> build-env.txt
          echo "TIMESTAMP=${{ steps.version.outputs.timestamp }}" >> build-env.txt
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> build-env.txt
          echo "GIT_SHA=${{ github.sha }}" >> build-env.txt

          cat build-env.txt

      - name: 上传构建环境变量
        uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build-env.txt
          retention-days: 7

      - name: 安装 Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: 预构建 AOP 产物
        # 触发 AOP 代码生成（@Demo 注解），生成 assets/code/*.txt 文件
        # 这些文件会被 widget_test.dart 读取，生成 Markdown 文档
        run: |
          cd tdesign-component/example
          flutter pub get
          flutter build apk --debug --dart-define=isCI=false || true
          flutter build web --dart-define=isCI=false || true

      - name: 缓存 AOP 产物
        # 缓存 AOP 生成的代码和文档资源，供 build-apk 和 build-web 复用
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/tdesign-component/example/.dart_tool
            ${{ github.workspace }}/tdesign-component/example/build
            ${{ github.workspace }}/tdesign-component/example/assets/code
          key: aop-cache-${{ github.run_id }}

  build-apk:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: 恢复 AOP 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/tdesign-component/example/.dart_tool
            ${{ github.workspace }}/tdesign-component/example/build
            ${{ github.workspace }}/tdesign-component/example/assets/code
          key: aop-cache-${{ github.run_id }}

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: 安装 Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: 写入版本和时间到 assets
        # 将版本号和编译时间写入 assets 文件，应用运行时读取显示在"关于我们"页面
        run: |
          echo "${{ needs.setup.outputs.component_version }}" > tdesign-component/example/assets/version
          # 将时间戳转换为毫秒级（Flutter DateTime 需要）
          TIMESTAMP="${{ needs.setup.outputs.timestamp }}"
          YEAR=${TIMESTAMP:0:4}
          MONTH=${TIMESTAMP:4:2}
          DAY=${TIMESTAMP:6:2}
          HOUR=${TIMESTAMP:8:2}
          MINUTE=${TIMESTAMP:10:2}
          SECOND=${TIMESTAMP:12:14}
          EPOCH=$(date -d "$YEAR-$MONTH-$DAY $HOUR:$MINUTE:$SECOND" +%s%3N)
          echo "$EPOCH" > tdesign-component/example/assets/publish_time

      - name: 构建 APK
        run: |
          cd tdesign-component/example
          flutter clean
          flutter pub get
          # 生成签名密钥，用于 APK 签名
          cd android/app
          STORE_PASSWORD="tdesign123456" KEY_PASSWORD="tdesign123456"
          keytool -genkeypair -alias tdesign_flutter_debug_key -keypass "$KEY_PASSWORD" -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" -dname "CN=TDesign Flutter Test,O=TDesign,C=CN" -keyalg RSA -keysize 2048 -validity 365
          chmod 644 keystore.jks
          cd ../..
          echo -e "storePassword=$STORE_PASSWORD\nkeyPassword=$KEY_PASSWORD\nkeyAlias=tdesign_flutter_debug_key\nstoreFile=keystore.jks" > android/key.properties
          # 使用 dart-define 注入版本信息到 APK
          flutter build apk --release --dart-define=isCI=true \
            --dart-define=VersionCode=${{ github.run_id }} \
            --dart-define=devopsUUID=${{ github.run_id }} \
            --dart-define=ComponentVersion=${{ needs.setup.outputs.component_version }} \
            --dart-define=BuildNo=${{ github.run_id }} \
            --dart-define=Timestamp=${{ needs.setup.outputs.timestamp }} \
            --dart-define=UniqueID=${{ needs.setup.outputs.unique_id }} \
            --dart-define=isPublish=false \
            --dart-define=isBeta=false \
            --dart-define=gitVersion=${{ github.sha }}

      - name: 重命名 APK
        # APK 文件名格式：tdesign-flutter-{version}-{unique_id}.apk
        # 例如：tdesign-flutter-0.2.7-20250127123456.apk
        run: |
          VERSION="${{ needs.setup.outputs.component_version }}-${{ needs.setup.outputs.unique_id }}"
          mv tdesign-component/example/build/app/outputs/flutter-apk/app-release.apk tdesign-flutter-$VERSION.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-apk
          path: tdesign-flutter-*.apk
          compression-level: 0 # 不压缩，避免 APKSigner 解压失败

  build-web:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: 恢复 AOP 缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/tdesign-component/example/.dart_tool
            ${{ github.workspace }}/tdesign-component/example/build
            ${{ github.workspace }}/tdesign-component/example/assets/code
          key: aop-cache-${{ github.run_id }}

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tdesign-site/package-lock.json

      - name: 安装 Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: 生成文档
        # 运行 widget 测试，根据 @Demo 注解生成 Markdown 文档
        # 文档会输出到 tdesign-site/src/ 目录
        run: |
          cd tdesign-component/example
          flutter test test/widget_test.dart --reporter expanded || true

      - name: 构建站点
        # 构建文档站点 + Flutter Web 应用，适配 Surge 静态托管
        # Surge 平台要求：无需 404/200 文件，SPA 路由由 _redirects 文件控制
        run: |
          cd tdesign-site && npm install --unsafe-perm && npm run site
          cd $GITHUB_WORKSPACE/tdesign-component/example
          flutter build web -t ./lib/main.dart --base-href /flutter/example/ --source-maps
          mkdir -p $GITHUB_WORKSPACE/tdesign-flutter-web/flutter/example
          cp -r $GITHUB_WORKSPACE/tdesign-site/_site/* $GITHUB_WORKSPACE/tdesign-flutter-web/
          cp -r $GITHUB_WORKSPACE/tdesign-site/_site/assets $GITHUB_WORKSPACE/tdesign-flutter-web/flutter/assets
          cp -r $GITHUB_WORKSPACE/tdesign-component/example/build/web/* $GITHUB_WORKSPACE/tdesign-flutter-web/flutter/example/
          # Surge 平台使用 _redirects 文件配置路由重定向
          echo "/* /index.html 200" > $GITHUB_WORKSPACE/tdesign-flutter-web/_redirects

      - name: 上传 Web
        uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-web
          path: ${{ github.workspace }}/tdesign-flutter-web
          retention-days: 15
