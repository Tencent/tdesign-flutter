name: PREVIEW_BUILD

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  setup:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    outputs:
      major_version: ${{ steps.version.outputs.major_version }}
      minor_version: ${{ steps.version.outputs.minor_version }}
      fix_version: ${{ steps.version.outputs.fix_version }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ github.run_number }}
      pr_number: ${{ github.event.number }}
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure Git to not use symlinks
        run: git config --global core.symlinks false

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "tdesign-site/pnpm-lock.yaml"

      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Set up Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          # 从pubspec.yaml中提取版本号
          VERSION=$(grep "version:" tdesign-component/pubspec.yaml | sed 's/version: //g' | xargs)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          FIX=$(echo $VERSION | cut -d. -f3)
          echo "major_version=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor_version=$MINOR" >> $GITHUB_OUTPUT
          echo "fix_version=$FIX" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create build env file
        run: |
          cat > build-env.txt << EOF
          MAJOR_VERSION=${{ steps.version.outputs.major_version }}
          MINOR_VERSION=${{ steps.version.outputs.minor_version }}
          FIX_VERSION=${{ steps.version.outputs.fix_version }}
          VERSION=${{ steps.version.outputs.version }}
          BUILD_NUMBER=${{ github.run_number }}
          PR_NUMBER=${{ github.event.number }}
          RUN_ID=${{ github.run_id }}
          SHA=${{ github.sha }}
          EOF

      - name: Upload build environment
        uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build-env.txt
          retention-days: 5

  build-apk:
    needs: setup
    if: "!cancelled()"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout and setup
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Update assets files
        run: |
          VERSION="${{ needs.setup.outputs.major_version }}.${{ needs.setup.outputs.minor_version }}.${{ needs.setup.outputs.fix_version }}"
          echo "$VERSION" > $GITHUB_WORKSPACE/tdesign-component/example/assets/version
          echo "$(date +%s%3N)" > $GITHUB_WORKSPACE/tdesign-component/example/assets/publish_time
          cat $GITHUB_WORKSPACE/tdesign-component/example/assets/version
          cat $GITHUB_WORKSPACE/tdesign-component/example/assets/publish_time

      - name: Build Flutter apk
        run: |
          cd $GITHUB_WORKSPACE/tdesign-component/example
          flutter clean
          flutter pub get

          cd ${{ github.workspace }}/tdesign-component/example/android/app
          STORE_PASSWORD="tdesign123456"
          KEY_PASSWORD="tdesign123456"
          keytool -genkeypair \
            -alias tdesign_flutter_debug_key \
            -keypass "$KEY_PASSWORD" \
            -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -dname "CN=TDesign Flutter Test,O=TDesign,C=CN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365

          chmod 644 keystore.jks
          cd ${{ github.workspace }}/tdesign-component/example/android
          echo "storePassword=$STORE_PASSWORD" > key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=tdesign_flutter_debug_key" >> key.properties
          echo "storeFile=keystore.jks" >> key.properties

          flutter build apk --release \
            --dart-define=isCI=true \
            --dart-define=VersionCode=${{ needs.setup.outputs.build_number }} \
            --dart-define=devopsUUID=${{ needs.setup.outputs.run_id }} \
            --dart-define=MajorVersion=${{ needs.setup.outputs.major_version }} \
            --dart-define=MinorVersion=${{ needs.setup.outputs.minor_version }} \
            --dart-define=FixVersion=${{ needs.setup.outputs.fix_version }} \
            --dart-define=BuildNo=${{ needs.setup.outputs.build_number }} \
            --dart-define=isPublish=false \
            --dart-define=isBeta=false \
            --dart-define=gitVersion=${{ needs.setup.outputs.sha }}

      - name: Rename and upload APK
        run: |
          VERSION="${{ needs.setup.outputs.major_version }}.${{ needs.setup.outputs.minor_version }}.${{ needs.setup.outputs.fix_version }}"
          BUILD="${{ needs.setup.outputs.build_number }}"
          cd ${{ github.workspace }}/tdesign-component/example/build/app/outputs/flutter-apk/
          mv app-release.apk tdesign-flutter-${VERSION}-${BUILD}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-apk
          path: ${{ github.workspace }}/tdesign-component/example/build/app/outputs/flutter-apk/tdesign-flutter-*.apk
          compression-level: 0

  build-site:
    needs: setup
    if: "!cancelled()"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout and setup
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "tdesign-site/pnpm-lock.yaml"

      - name: Set up Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: Generate web documentation
        run: |
          cd $GITHUB_WORKSPACE/tdesign-component/example
          flutter test test/widget_test.dart --reporter expanded || true

      - name: Build site
        working-directory: ./tdesign-site
        run: |
          pnpm install --frozen-lockfile
          npm run site

      - name: Update assets files for web
        run: |
          VERSION="${{ needs.setup.outputs.major_version }}.${{ needs.setup.outputs.minor_version }}.${{ needs.setup.outputs.fix_version }}"
          echo "$VERSION" > $GITHUB_WORKSPACE/tdesign-component/example/assets/version
          echo "$(date +%s%3N)" > $GITHUB_WORKSPACE/tdesign-component/example/assets/publish_time
          cat $GITHUB_WORKSPACE/tdesign-component/example/assets/version
          cat $GITHUB_WORKSPACE/tdesign-component/example/assets/publish_time

      - name: Build site demo
        working-directory: ./tdesign-component/example
        run: |
          flutter build web -t ./lib/main.dart --base-href /flutter/example/ --source-maps

      - name: Prepare web output
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p tdesign-flutter-web/flutter/example/
          cp -r tdesign-site/_site/* tdesign-flutter-web/
          rm -rf tdesign-flutter-web/assets

          # Rewrite index.html
          sed -i 's|<meta http-equiv="X-UA-Compatible" content="ie=edge">|<meta http-equiv="X-UA-Compatible" content="ie=edge">\n  <base href="/">|' tdesign-flutter-web/index.html || true
          sed -i "s|src=\"/flutter/|src=\"flutter/|g; s|href=\"/flutter/|href=\"flutter/|g; s|src='/flutter/|src='flutter/|g; s|href='/flutter/|href='flutter/|g" tdesign-flutter-web/index.html || true

          cp -v tdesign-site/_site/index.html tdesign-flutter-web/404.html || true
          cp -v tdesign-site/_site/index.html tdesign-flutter-web/200.html || true
          cp -r tdesign-site/_site/assets tdesign-flutter-web/flutter/assets || true
          cp -r tdesign-component/example/build/web/* tdesign-flutter-web/flutter/example/ || true
          echo '/* /index.html 200' > "$GITHUB_WORKSPACE/CNAME"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-web
          path: ${{ github.workspace }}/tdesign-flutter-web
          retention-days: 5
