name: PREVIEW_BUILD

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  tdesign-flutter-site:
    runs-on: macos-latest
    # Skip workflow if commit message contains [skip ci] or [ci skip]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure Git to not use symlinks
        run: git config --global core.symlinks false

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "tdesign-site/pnpm-lock.yaml"

      - uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Select Xcode 16 for iOS build
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Set up Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "version:" tdesign-component/pubspec.yaml | sed 's/version: //g' | xargs)
          echo "major_version=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor_version=$(echo $VERSION | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "fix_version=$(echo $VERSION | cut -d. -f3)" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update assets files
        run: |
          VERSION="${{ steps.version.outputs.major_version }}.${{ steps.version.outputs.minor_version }}.${{ steps.version.outputs.fix_version }}"
          echo "$VERSION" > $GITHUB_WORKSPACE/tdesign-component/example/assets/version
          date +%s%3N > $GITHUB_WORKSPACE/tdesign-component/example/assets/publish_time

      - name: Build Flutter apk
        run: |
          cd $GITHUB_WORKSPACE/tdesign-component/example
          flutter clean > /dev/null 2>&1

          cd ${{ github.workspace }}/tdesign-component/example/android/app
          STORE_PASSWORD="tdesign123456"
          KEY_PASSWORD="tdesign123456"
          keytool -genkeypair 2>/dev/null \
            -alias tdesign_flutter_debug_key \
            -keypass "$KEY_PASSWORD" \
            -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -dname "CN=TDesign Flutter Test,O=TDesign,C=CN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365
          chmod 644 keystore.jks

          cd ${{ github.workspace }}/tdesign-component/example/android
          echo "storePassword=$STORE_PASSWORD" > key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=tdesign_flutter_debug_key" >> key.properties
          echo "storeFile=keystore.jks" >> key.properties

          flutter build apk --release \
            --dart-define=isCI=true \
            --dart-define=VersionCode=${{ github.run_number }} \
            --dart-define=devopsUUID=${{ github.run_id }} \
            --dart-define=MajorVersion=${{ steps.version.outputs.major_version }} \
            --dart-define=MinorVersion=${{ steps.version.outputs.minor_version }} \
            --dart-define=FixVersion=${{ steps.version.outputs.fix_version }} \
            --dart-define=BuildNo=${{ github.run_number }} \
            --dart-define=isPublish=false \
            --dart-define=isBeta=false \
            --dart-define=gitVersion=${{ github.sha }}
      - name: Rename APK with version
        run: |
          VERSION="${{ steps.version.outputs.major_version }}.${{ steps.version.outputs.minor_version }}.${{ steps.version.outputs.fix_version }}"
          BUILD="${{ github.run_number }}"
          cd ${{ github.workspace }}/tdesign-component/example/build/app/outputs/flutter-apk/
          mv app-release.apk tdesign-flutter-${VERSION}-${BUILD}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-apk
          path: ${{ github.workspace }}/tdesign-component/example/build/app/outputs/flutter-apk/tdesign-flutter-*.apk
          compression-level: 0

      - name: Generate web documentation from demo code
        run: |
          cd $GITHUB_WORKSPACE/tdesign-component/example
          flutter test test/widget_test.dart --reporter compact || true

      - name: Build site
        working-directory: ./tdesign-site
        run: |
          pnpm install --frozen-lockfile
          npm run site

      - name: Build site Demo
        working-directory: ./tdesign-component/example
        run: |
          flutter build web -t ./lib/main.dart --base-href /flutter/example/ --source-maps
          cd $GITHUB_WORKSPACE
          mkdir -p tdesign-flutter-web/flutter/example/
          cp -r tdesign-site/_site/* tdesign-flutter-web/
          rm -rf tdesign-flutter-web/assets
          for f in "$GITHUB_WORKSPACE/tdesign-flutter-web/index.html"; do
            if [ -f "$f" ]; then
              if ! grep -q '<base href="/">' "$f"; then
                sed -i 's|<meta http-equiv="X-UA-Compatible" content="ie=edge">|<meta http-equiv="X-UA-Compatible" content="ie=edge">\n  <base href="/">|' "$f"
              fi
              sed -i "s|src=\"/flutter/|src=\"flutter/|g; s|href=\"/flutter/|href=\"flutter/|g; s|src='/flutter/|src='flutter/|g; s|href='/flutter/|href='flutter/|g" "$f"
            fi
          done
          cp tdesign-site/_site/index.html tdesign-flutter-web/404.html
          cp tdesign-site/_site/index.html tdesign-flutter-web/200.html
          cp -r tdesign-site/_site/assets tdesign-flutter-web/flutter/assets
          cp -r tdesign-component/example/build/web/* tdesign-flutter-web/flutter/example/
          echo '/* /index.html 200' > "$GITHUB_WORKSPACE/CNAME"
      - uses: actions/upload-artifact@v4
        with:
          name: tdesign-flutter-web
          path: ${{ github.workspace }}/tdesign-flutter-web
          retention-days: 5

