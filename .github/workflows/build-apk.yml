name: Build Demo APK

on:
  workflow_call:
    inputs:
      flutter-version:
        required: true
        type: string
      version:
        required: true
        type: string
      build-number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true
      - name: Set up Java and Gradle dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            tdesign-component/example/android/**/*.gradle
            tdesign-component/example/android/gradle.properties
            tdesign-component/example/android/gradle/wrapper/gradle-wrapper.properties
            tdesign-component/example/pubspec.lock
      - name: Install Demo dependencies
        working-directory: tdesign-component/example
        env:
          FLUTTER_VERSION: ${{ inputs.flutter-version }}
        run: |
          if [ "$FLUTTER_VERSION" = '3.32.0' ]; then
            flutter pub get --enforce-lockfile
          else
            rm pubspec.lock
            flutter pub get
          fi
      - name: Download prepared resources
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: tdesign-component/example/assets
      - name: Build release APK
        working-directory: tdesign-component/example
        env:
          DEMO_VERSION: ${{ inputs.version }}
          DEMO_BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          flutter build apk --release --build-name "$DEMO_VERSION" --build-number "$DEMO_BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/tdesign-flutter-${DEMO_VERSION}-${DEMO_BUILD_NUMBER}.apk"
      # Native release builds must regenerate plugin registration (including on Flutter 3.32.0).
      - name: Verify fixed SDK lockfile was preserved
        if: inputs.flutter-version == '3.32.0'
        run: git diff --exit-code -- tdesign-component/example/pubspec.lock
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.flutter-version == '3.32.0' && 'tdesign-flutter-apk' || 'tdesign-flutter-apk-latest' }}
          path: tdesign-component/example/build/app/outputs/flutter-apk/tdesign-flutter-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
