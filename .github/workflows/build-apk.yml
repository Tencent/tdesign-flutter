# 复用已准备的 Demo 资源，构建指定 Flutter 版本的 release APK 并上传。
name: Reusable / Build APK

on:
  workflow_call:
    inputs:
      flutter-version:
        required: true
        type: string
      version:
        required: true
        type: string
      build-number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true
      - name: Set up Java and Gradle dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            tdesign-component/example/android/**/*.gradle
            tdesign-component/example/android/gradle.properties
            tdesign-component/example/android/gradle/wrapper/gradle-wrapper.properties
      - name: Download prepared resources
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: tdesign-component/example/assets
      # Flutter latest 强制要求 Gradle >= 9.3.1 / AGP >= 9.1.1，但最低支持版本
      # 3.32.0 自带的 Gradle 插件源码在该 Kotlin 级别下编不过
      # (FlutterPlugin.kt:715 Unresolved reference 'fileMode')，仓库默认值必须
      # 保持在 3.32.0 能构建的旧工具链上。这里只在构建 latest 时覆盖，
      # 两套工具链各跑各的版本，最低支持版本的验证范围不变。
      - name: Override Gradle and AGP for Flutter latest
        if: inputs.flutter-version != '3.32.0'
        working-directory: tdesign-component/example/android
        run: |
          python3 - <<'PY'
          import re, pathlib, sys

          swaps = [
              ('gradle/wrapper/gradle-wrapper.properties',
               'gradle-8.14-bin.zip', 'gradle-9.3.1-bin.zip'),
              ('settings.gradle',
               '"com.android.application" version "8.11.1"',
               '"com.android.application" version "9.1.1"'),
          ]
          for name, old, new in swaps:
              path = pathlib.Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  # 仓库默认值被改动时直接失败，避免静默构建出错误工具链。
                  sys.exit(f'{name}: expected {old!r} not found')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{name}: {old} -> {new}')
          PY
          grep -n 'distributionUrl' gradle/wrapper/gradle-wrapper.properties
          grep -n 'com.android.application' settings.gradle
      # 保留默认依赖与插件准备，避免 3.32.0 使用 --no-pub 时注册代码不一致。
      - name: Build release APK
        working-directory: tdesign-component/example
        env:
          DEMO_VERSION: ${{ inputs.version }}
          DEMO_BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/tdesign-flutter-${DEMO_VERSION}-${DEMO_BUILD_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.flutter-version == '3.32.0' && 'tdesign-flutter-apk' || 'tdesign-flutter-apk-latest' }}
          path: tdesign-component/example/build/app/outputs/flutter-apk/tdesign-flutter-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
