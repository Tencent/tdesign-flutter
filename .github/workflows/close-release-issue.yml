# 该 workflow 会在 PR 合并到 develop 分支时，自动关闭所有 label 为版本号的 issue
name: Close issues with release label

on:
  pull_request:
    types: [closed]
    # 只有发布的时候才进行该 workflow
    paths:
      - 'tdesign-component/**/pubspec.yaml'

jobs:
  close_issues:
    # 只有当 PR 被合并且目标分支是 develop 且来源分支是 release/* 格式时才执行
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: 提取版本号（从 head.ref 提取）
        id: extract_version
        run: echo "version=${GITHUB_HEAD_REF#release/}" >> $GITHUB_OUTPUT

      - name: 关闭对应版本的 issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.extract_version.outputs.version }}';
            const { owner, repo } = context.repo;
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${version}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: version, per_page: 100
            });

            for (const issue of issues) {
              if (!issue.pull_request) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `该 issue 已在 [${version} 版本](${releaseUrl}) 中处理。`
                });
              }
            }
