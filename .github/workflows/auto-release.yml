name: auto-release

on:
  pull_request:
    types: [closed]
    paths: ['tdesign-component/pubspec.yaml']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: TDesignOteam/tdesign-changelog-action@next
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          manifest-path: tdesign-component/pubspec.yaml

  dry-run-publish:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.32.0

      - name: install
        working-directory: ./tdesign-component
        run: flutter pub get

      - name: dry run publish
        working-directory: ./tdesign-component
        run: flutter pub publish --dry-run