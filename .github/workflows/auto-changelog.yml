name: auto-changelog

on:
  pull_request:
    types: [opened]
    paths: ['tdesign-component/pubspec.yaml']

  issue_comment:
    types: [edited]

jobs:
  generate-changelog:
    if: github.event.pull_request && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/tdesign-changelog-action@next
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          manifest-path: tdesign-component/pubspec.yaml

  commit-changelog:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/tdesign-changelog-action@next
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          manifest-path: tdesign-component/pubspec.yaml
          changelog-path: tdesign-component/CHANGELOG.md
