name: Flutter Coverage

# TEMPORARY MIGRATION COMPATIBILITY: Limit coverage to Theme and the migrated
# base components. Expand this list as later component PRs are merged.
on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdesign-component
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run base component tests with coverage
        run: >-
          flutter test --coverage --reporter expanded
          test/components/button
          test/components/divider
          test/components/fab
          test/components/icon
          test/components/link
          test/components/text

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: tdesign-component/coverage/lcov.info
