name: Flutter Coverage

on:
  workflow_dispatch: # 手动在 Actions 页面触发
  push:
    branches: ['**']

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdesign-component
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 运行测试并采集覆盖率
        # 即便有少量用例失败也继续，确保产出 lcov
        continue-on-error: true
        run: flutter test --coverage --reporter expanded

      - name: 上传 lcov 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: tdesign-component/coverage/lcov.info
