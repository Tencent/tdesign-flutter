# 统一生成 Demo 资源和预览元数据，供同次运行的平台构建复用。
name: Reusable / Prepare Demo

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      build-number:
        value: ${{ jobs.prepare.outputs.build-number }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Demo resources
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-number: ${{ steps.metadata.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: 3.32.0
          channel: stable
          cache: true
          cache-sdk: true
      - name: Install generator dependencies
        working-directory: tdesign-component
        run: flutter pub get
      - name: Generate API documents
        working-directory: tdesign-component
        run: sh demo_tool/all_build.sh
      - name: Generate example snippets
        working-directory: tdesign-component
        run: dart run tool/generate_example_code.dart
      - name: Write Demo build information
        working-directory: tdesign-component
        run: dart tool/write_demo_build_info.dart
      - name: Verify Flutter component contracts
        run: node scripts/check-flutter-component-contracts.mjs
      # 运行编号用于预览元数据和下载文件名，不覆盖包内版本号。
      - name: Prepare build metadata
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
        run: |
          VERSION=$(cat tdesign-component/example/assets/version)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Demo version" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid workflow run number" >&2
            exit 1
          fi
          {
            echo "PR_NUMBER=$PR_NUMBER"
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          } > build-env.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Upload prepared resources
        uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: |
            tdesign-component/example/assets/api/
            tdesign-component/example/assets/code/
            tdesign-component/example/assets/version
            tdesign-component/example/assets/publish_time
          if-no-files-found: error
          retention-days: 5
      - name: Upload preview metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build-env.txt
          if-no-files-found: error
          retention-days: 5
