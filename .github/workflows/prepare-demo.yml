name: Prepare Demo resources

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      build-number:
        value: ${{ jobs.prepare.outputs.build-number }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-number: ${{ steps.metadata.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: 3.32.0
          channel: stable
          cache: true
          cache-sdk: true
      - name: Install generator dependencies
        working-directory: tdesign-component
        run: |
          flutter pub get
          git diff --exit-code -- example/pubspec.lock
      - name: Verify locked Demo dependencies
        working-directory: tdesign-component/example
        run: flutter pub get --enforce-lockfile
      - name: Prepare Demo resources
        working-directory: tdesign-component
        run: |
          sh demo_tool/all_build.sh
          dart run tool/generate_example_code.dart
          dart tool/write_demo_build_info.dart
      - name: Verify Flutter component contracts
        run: node scripts/check-flutter-component-contracts.mjs
      - name: Verify build metadata contracts
        run: node --test scripts/demo-build-metadata.test.mjs
      - name: Prepare build metadata
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
        run: node scripts/demo-build-metadata.mjs
      - name: Upload prepared resources
        uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: |
            tdesign-component/example/assets/api/
            tdesign-component/example/assets/code/
            tdesign-component/example/assets/version
            tdesign-component/example/assets/publish_time
          if-no-files-found: error
          retention-days: 5
      - name: Upload preview metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-env
          path: build-env.txt
          if-no-files-found: error
          retention-days: 5
