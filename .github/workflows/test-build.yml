name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - apk
          - ios
          - web
        flutter-version:
          - 3.32.0
          # - 3.x
        include:
          - platform: apk
            os: ubuntu-latest
            build: flutter build apk -t ./lib/main.dart --release
          - platform: ios
            os: macos-14
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode version
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version

      - name: generate api md
        working-directory: ./tdesign-component
        run: sh ./demo_tool/all_build.sh

      - name: Check example code snippets
        working-directory: ./tdesign-component
        run: dart run tool/generate_example_code.dart --check

      - name: Check Flutter component contracts
        run: node scripts/check-flutter-component-contracts.mjs

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Diagnose iOS linker settings
        if: matrix.platform == 'ios'
        run: echo "Xcode ${{ matrix.platform }} ready"
      - name: flutter build
        working-directory: ./tdesign-component/example
        run: ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
