name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  prepare-demo:
    uses: ./.github/workflows/prepare-demo.yml

  apk:
    needs: prepare-demo
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ${{ fromJSON(github.event_name == 'pull_request' && '["latest"]' || '["3.32.0", "latest"]') }}
    uses: ./.github/workflows/build-apk.yml
    with:
      flutter-version: ${{ matrix.flutter-version }}
      version: ${{ needs.prepare-demo.outputs.version }}
      build-number: ${{ needs.prepare-demo.outputs.build-number }}

  analyze:
    name: analyze (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Analyze component
        working-directory: ./tdesign-component
        run: flutter analyze --no-pub --fatal-infos

      - name: Verify public API documentation coverage
        working-directory: ./tdesign-component
        run: dart run tool/audit_api_docs.dart

  test:
    name: test (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run component regression tests with coverage
        working-directory: ./tdesign-component
        run: dart run tool/run_component_regression.dart

      - name: Test and analyze standalone css2token package
        working-directory: ./packages/css2token
        run: |
          dart pub get
          dart test
          dart analyze --fatal-infos

      - name: Verify public API migration in an external consumer
        working-directory: ./tdesign-component
        run: dart run tool/run_migration_consumer.dart

      - name: Test regression tooling
        working-directory: ./tdesign-component
        run: flutter test --no-pub test/tool/check_component_coverage_test.dart test/tool/run_component_regression_test.dart test/tool/run_visual_regression_test.dart test/tool/audit_api_docs_test.dart test/tool/typedef_docs_test.dart test/tool/api_presentation_test.dart

      - name: Check example structure and copied snippets
        working-directory: ./tdesign-component
        run: |
          dart run tool/check_demo_structure.dart
          dart run tool/check_demo_snippets.dart

      - name: Run example shared functional tests
        working-directory: ./tdesign-component
        run: dart run tool/run_example_regression.dart

  visual-regression:
    name: visual regression (flutter 3.32.0 linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: 3.32.0
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run visual regression tests
        working-directory: ./tdesign-component
        run: dart run tool/run_visual_regression.dart

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-flutter-3.32.0
          path: |
            tdesign-component/test/**/failures/
            tdesign-component/example/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: prepare-demo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ios
          - web
        flutter-version:
          - 3.32.0
          - latest
        include:
          - platform: ios
            os: macos-15
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version

      - name: install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Download prepared resources
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: tdesign-component/example/assets

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: |
          ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
