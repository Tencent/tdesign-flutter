name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  analyze:
    name: analyze (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Analyze component
        working-directory: ./tdesign-component
        run: flutter analyze --no-pub --fatal-infos

  test:
    name: test (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run refresh tests with coverage
        working-directory: ./tdesign-component
        run: flutter test test/components/refresh/t_refresh_test.dart --coverage

      - name: Run refresh golden tests
        working-directory: ./tdesign-component
        run: flutter test test/components/refresh/t_refresh_golden_test.dart

      - name: Run Upload tests and golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component
        run: flutter test test/components/upload/t_upload_test.dart test/components/upload/t_upload_golden_test.dart

      - name: Install example dependencies for page golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run Form Input Textarea page golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component/example
        run: flutter test test/form_input_textarea_page_golden_test.dart

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - apk
          - ios
          - web
        flutter-version:
          - 3.32.0
          - latest
        include:
          - platform: apk
            os: ubuntu-latest
            build: flutter build apk -t ./lib/main.dart --release
          - platform: ios
            os: macos-14
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version

      - name: generate api md
        working-directory: ./tdesign-component
        run: sh ./demo_tool/all_build.sh

      - name: Check example code snippets
        working-directory: ./tdesign-component
        run: dart run tool/generate_example_code.dart --check

      - name: Check Flutter component contracts
        run: node scripts/check-flutter-component-contracts.mjs

      - name: install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Diagnose iOS linker settings
        if: matrix.platform == 'ios'
        run: echo "Xcode ${{ matrix.platform }} ready"
      - name: flutter build
        working-directory: ./tdesign-component/example
        run: ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
