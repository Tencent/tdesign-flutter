name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  analyze:
    name: analyze (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Analyze component
        working-directory: ./tdesign-component
        run: flutter analyze --no-pub --fatal-infos

  test:
    name: test (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    # Golden tests require a stable Linux userspace in addition to the pinned
    # Flutter SDK. Do not use ubuntu-latest for pixel-exact baselines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run refresh tests with coverage
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/refresh/t_refresh_test.dart --coverage
          dart run tool/check_component_coverage.dart refresh

      - name: Run refresh tests with coverage without Demo assertions
        if: matrix.flutter-version != '3.32.0'
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/refresh/t_refresh_test.dart --exclude-tags demo --coverage
          dart run tool/check_component_coverage.dart refresh

      - name: Run Switch tests with coverage
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/switch/t_switch_test.dart test/components/switch/t_cupertino_switch_test.dart --coverage
          dart run tool/check_component_coverage.dart switch

      - name: Run Upload tests with coverage
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/upload/t_upload_test.dart --coverage
          dart run tool/check_component_coverage.dart upload

      - name: Run Form tests with coverage
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/form/t_form_test.dart --coverage
          dart run tool/check_component_coverage.dart form

      - name: Run Input tests with coverage
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/input/t_input_test.dart test/components/input/t_input_theme_test.dart --coverage
          dart run tool/check_component_coverage.dart input

      - name: Run Textarea tests with coverage
        working-directory: ./tdesign-component
        run: |
          flutter test test/components/textarea/t_textarea_test.dart --coverage
          dart run tool/check_component_coverage.dart textarea

      - name: Test component coverage checker
        working-directory: ./tdesign-component
        run: flutter test test/tool/check_component_coverage_test.dart

      - name: Run refresh golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component
        run: flutter test test/components/refresh/t_refresh_golden_test.dart

      - name: Run Upload golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component
        run: flutter test test/components/upload/t_upload_golden_test.dart

      - name: Install example dependencies for page tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run Form Input Textarea page golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component/example
        run: flutter test test/form_input_textarea_page_golden_test.dart

      - name: Run Switch page tests and golden tests
        if: matrix.flutter-version == '3.32.0'
        working-directory: ./tdesign-component/example
        run: flutter test test/switch_page_test.dart

      - name: Upload golden failure images
        if: failure() && matrix.flutter-version == '3.32.0'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-flutter-3.32.0
          path: |
            tdesign-component/test/**/failures/
            tdesign-component/example/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - apk
          - ios
          - web
        flutter-version:
          - 3.32.0
          - latest
        include:
          - platform: apk
            os: ubuntu-latest
            build: flutter build apk -t ./lib/main.dart --release
          - platform: ios
            os: macos-14
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version

      - name: generate api md
        working-directory: ./tdesign-component
        run: sh ./demo_tool/all_build.sh

      - name: Check example code snippets
        working-directory: ./tdesign-component
        run: dart run tool/generate_example_code.dart --check

      - name: Check Flutter component contracts
        run: node scripts/check-flutter-component-contracts.mjs

      - name: install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Diagnose iOS linker settings
        if: matrix.platform == 'ios'
        run: echo "Xcode ${{ matrix.platform }} ready"
      - name: flutter build
        working-directory: ./tdesign-component/example
        run: ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
