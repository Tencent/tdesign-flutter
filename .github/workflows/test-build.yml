name: test-build

# TEMPORARY MIGRATION COMPATIBILITY: The full example app still references
# components outside this PR. Restore example APK/iOS/Web builds only after
# their dependencies are migrated and exported from the package root.
on:
  pull_request:
    paths-ignore:
      - "tdesign-site/**"
      - "tdesign-adaptation/**"
      - "*.md"
  push:
    paths-ignore:
      - "tdesign-site/**"
      - "tdesign-adaptation/**"
      - "*.md"

jobs:
  base-component-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdesign-component
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          cache: true

      - name: tdesign-adaptation
        run: sh ./init.sh

      - name: flutter pub get
        run: flutter pub get

      - name: Test migrated base components
        run: >-
          flutter test --reporter compact
          test/components/button
          test/components/divider
          test/components/fab
          test/components/icon
          test/components/link
          test/components/text
