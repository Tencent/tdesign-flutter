name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  # 各平台复用同次运行生成的资源，避免矩阵内重复生成。
  prepare-demo:
    uses: ./.github/workflows/prepare-demo.yml

  # PR 的 3.32.0 APK 由预览流程提供；develop 推送仍验证双版本。
  apk:
    needs: prepare-demo
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ${{ fromJSON(github.event_name == 'pull_request' && '["latest"]' || '["3.32.0", "latest"]') }}
    uses: ./.github/workflows/build-apk.yml
    with:
      flutter-version: ${{ matrix.flutter-version }}
      version: ${{ needs.prepare-demo.outputs.version }}
      build-number: ${{ needs.prepare-demo.outputs.build-number }}

  analyze:
    name: analyze (flutter ${{ matrix.flutter-version }})
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Analyze component
        working-directory: ./tdesign-component
        run: flutter analyze --no-pub --fatal-infos

      - name: Verify public API documentation coverage
        working-directory: ./tdesign-component
        run: dart run tool/audit_api_docs.dart

  # 三类测试分别使用独立 runner，复用配置并保留逐组件覆盖率检查。
  regression:
    name: ${{ matrix.suite }} tests (flutter ${{ matrix.flutter-version }}, group ${{ matrix.shard || 'all' }})
    strategy:
      fail-fast: false
      matrix:
        suite: [examples, tooling]
        flutter-version:
          - 3.32.0
          - latest
        include:
          - {suite: components, flutter-version: '3.32.0', shard: 1}
          - {suite: components, flutter-version: '3.32.0', shard: 2}
          - {suite: components, flutter-version: latest, shard: 1}
          - {suite: components, flutter-version: latest, shard: 2}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Install example dependencies
        if: matrix.suite == 'examples'
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run component regression tests with coverage
        if: matrix.suite == 'components'
        working-directory: ./tdesign-component
        run: dart run tool/run_component_regression.dart --shard=${{ matrix.shard }}

      - name: Test and analyze standalone css2token package
        if: matrix.suite == 'tooling'
        working-directory: ./packages/css2token
        run: |
          dart pub get
          dart test
          dart analyze --fatal-infos

      - name: Verify public API migration in an external consumer
        if: matrix.suite == 'tooling'
        working-directory: ./tdesign-component
        run: dart run tool/run_migration_consumer.dart

      - name: Test regression tooling
        if: matrix.suite == 'tooling'
        working-directory: ./tdesign-component
        run: flutter test --no-pub test/tool/check_component_coverage_test.dart test/tool/run_component_regression_test.dart test/tool/run_visual_regression_test.dart test/tool/audit_api_docs_test.dart test/tool/typedef_docs_test.dart test/tool/api_presentation_test.dart

      - name: Check example structure and copied snippets
        if: matrix.suite == 'tooling'
        working-directory: ./tdesign-component
        run: |
          dart run tool/check_demo_structure.dart
          dart run tool/check_demo_snippets.dart

      - name: Run example shared functional tests
        if: matrix.suite == 'examples'
        working-directory: ./tdesign-component
        run: dart run tool/run_example_regression.dart

  # 保留原必需检查名称，全部功能测试分支成功才通过。
  test:
    name: test (flutter ${{ matrix.flutter-version }})
    needs: regression
    if: always()
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.32.0
          - latest
    runs-on: ubuntu-latest
    steps:
      - name: Require all regression jobs to succeed
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          if [[ "$REGRESSION_RESULT" != "success" ]]; then
            echo "::error::Regression jobs did not all succeed"
            exit 1
          fi

  # Golden 按组件名固定分两组，使用独立目录和独立失败产物。
  visual-shards:
    name: visual group ${{ matrix.shard }} (flutter 3.32.0 linux)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: 3.32.0
          channel: stable
          cache: true
          cache-sdk: true

      - name: Install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Run visual regression tests
        working-directory: ./tdesign-component
        run: dart run tool/run_visual_regression.dart --shard=${{ matrix.shard }}

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-flutter-3.32.0-group-${{ matrix.shard }}
          path: |
            tdesign-component/test/**/failures/
            tdesign-component/example/test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  # 保留原视觉门禁名称，任一组失败、取消或跳过均不能通过。
  visual-regression:
    name: visual regression (flutter 3.32.0 linux)
    needs: visual-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all visual groups to succeed
        env:
          VISUAL_RESULT: ${{ needs.visual-shards.result }}
        run: |
          if [[ "$VISUAL_RESULT" != "success" ]]; then
            echo "::error::Visual groups did not all succeed"
            exit 1
          fi

  # Web/iOS 保留双版本构建，APK 使用上方独立任务。
  build:
    needs: prepare-demo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ios
          - web
        flutter-version:
          - 3.32.0
          - latest
        include:
          - platform: ios
            os: macos-15
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-sdk: true

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version

      - name: install component dependencies
        working-directory: ./tdesign-component
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: install example dependencies
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Download prepared resources
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: tdesign-component/example/assets

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: |
          ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
