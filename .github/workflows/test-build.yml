name: test-build

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.16.9
          - 3.32.0
          - 3.x
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@test
        with:
          flutter-version: ${{ matrix.flutter-version }}
          aop-registry: true
          cache: true
      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: Get tdesign-flutter-generator
        uses: actions/checkout@v4
        with:
          repository: TDesignOteam/tdesign-flutter-generator
          path: ./example/tdesign-flutter-generator

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get --verbose

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: flutter build apk -t ./lib/main.dart --debug


  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.16.9
          - 3.32.0
          - 3.x
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@test
        with:
          flutter-version: ${{ matrix.flutter-version }}
          aop-registry: true
          cache: true

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: Get tdesign-flutter-generator
        uses: actions/checkout@v4
        with:
          repository: TDesignOteam/tdesign-flutter-generator
          path: ./example/tdesign-flutter-generator

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get --verbose

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: flutter build ios --release --no-codesign

  build-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.16.9
          - 3.32.0
          - 3.x
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@test
        with:
          flutter-version: ${{ matrix.flutter-version }}
          aop-registry: true
          cache: true
      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: Get tdesign-flutter-generator
        uses: actions/checkout@v4
        with:
          repository: TDesignOteam/tdesign-flutter-generator
          path: ./example/tdesign-flutter-generator

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get --verbose

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: flutter build web