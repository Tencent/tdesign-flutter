name: test-build

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "tdesign-adaptation/**"
      - "*.md"
  push:
    branches: [develop]
    paths-ignore:
      - "tdesign-site/**"
      - "tdesign-adaptation/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - apk
          - ios
          - web
        flutter-version:
          - 3.32.0
          # 当前对于 3.4x.x 版本，AOP 有问题先忽略
          # - 3.x
        include:
          - platform: apk
            os: ubuntu-latest
            build: flutter build apk -t ./lib/main.dart --release
          - platform: ios
            os: macos-latest
            build: flutter build ios -t ./lib/main.dart --no-codesign --release
          - platform: web
            os: ubuntu-latest
            build: flutter build web -t ./lib/main.dart --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
          aop-registry: true
          aop-project-path: ./tdesign-component/example

      - name: Diagnose iOS toolchain
        if: matrix.platform == 'ios'
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          pod --version
          flutter --version
          git -C "$FLUTTER_ROOT" rev-parse HEAD
          git -C "$FLUTTER_ROOT" diff --stat
          git -C "$FLUTTER_ROOT" status --short

      - name: tdesign-adaptation
        run: sh ./tdesign-component/init.sh

      - name: generate api md
        working-directory: ./tdesign-component
        run: sh ./demo_tool/all_build.sh

      - name: flutter pub get
        working-directory: ./tdesign-component/example
        run: flutter pub get ${{ runner.debug && '--verbose' || '' }}

      - name: Diagnose iOS linker settings
        if: matrix.platform == 'ios'
        working-directory: ./tdesign-component/example
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -showBuildSettings | \
            grep -E 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|LIBRARY_SEARCH_PATHS|OTHER_LDFLAGS|SWIFT_VERSION'

      - name: flutter build
        working-directory: ./tdesign-component/example
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ${{ matrix.build }} --verbose
          else
            ${{ matrix.build }} ${{ runner.debug && '--verbose' || '' }}
          fi
